glossar:()=>`<h2>Call-Glossar</h2><p class=s>Begriffe aus Voice und Chat. Wähle links eine Kategorie oder klicke auf "Gesamtübersicht".</p>${Object.keys(GL_CAT).map((cat, i) => D(cat, L([...GL_CAT[cat]].sort((a,b)=>a[0].localeCompare(b[0])).map(c => `<b>${c[0]}</b> | ${c[1]}`)), 0, '', `gl-cat-${i}`)).join('')}`,
castles:()=>`<h2>Castles <span class=tag>TODO</span></h2><p class=s>Stand der Informationen bei Patches prüfen.</p>${D('Aufbau und Kisten',L(['Zwei Layouts: 4 Eingänge (NW, NE, SW, SE) oder 2 Eingänge mit One-Way-Choke','Kisten öffnen zu festen Timern: grün, blau, lila, gold. Am Wochenende und am Resetday immer gold','Nach dem Cap alle die Castlekiste klicken: Might und Seasonpoints für die Gilde']),0)}${D('Gates und Lordroom',L(['Gates samt HP stehen auf der Minimap, ein erneutes Cap setzt sie zurück','Zum Durchklicken Force Combat Mode in den Einstellungen ausschalten','Gates mit Belagerungshämmern brechen, Guards dahinter von den DDs töten lassen','Lordroom: Elite-Guards zusammenziehen, dann Castlelord, nur eine Gilde im Cap-Ring','Mörser machen prozentualen Schaden: Treffer vermeiden']))}${D('Strategien',L(['Von Südwest siegen für bessere Sicht, gegen Kite & Clap als Angreifer eher von Norden','Gegen Clap & Kite von Wänden fernhalten','Heiler können in den Pockets von dort aus heilen']))}`,
terris:()=>`<h2>Territories <span class=tag>TODO</span></h2><p class=s>Stand der Informationen bei Patches prüfen.</p><h3>Territory-Arten</h3><div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;"><div class="card" style="margin:0; padding:0; overflow:hidden; text-align:center; position:relative; background:var(--bg);">${SVG_TERR.farm1}<b style="display:block; padding:12px; border-top:var(--bw) solid var(--ln);">Farm Territory 1</b></div><div class="card" style="margin:0; padding:0; overflow:hidden; text-align:center; position:relative; background:var(--bg);">${SVG_TERR.farm2}<b style="display:block; padding:12px; border-top:var(--bw) solid var(--ln);">Farm Territory 2</b></div><div class="card" style="margin:0; padding:0; overflow:hidden; text-align:center; position:relative; background:var(--bg);">${SVG_TERR.res1}<b style="display:block; padding:12px; border-top:var(--bw) solid var(--ln);">Resource Territory 1</b></div><div class="card" style="margin:0; padding:0; overflow:hidden; text-align:center; position:relative; background:var(--bg);">${SVG_TERR.res2}<b style="display:block; padding:12px; border-top:var(--bw) solid var(--ln);">Resource Territory 2</b></div></div>${D('Grundlagen',L(['Rotes Viereck auf der Karte mit Center-Mage in der Mitte und PvE-Wachen','Launch nur in der Prime Time, der Angriff gilt für den nächsten Tag','Einnehmen in den ersten 20 Minuten: Center-Mage töten, Turm anklicken und channeln','Mauern: zuerst Crystal-Schild, dann zweiter Lebensbalken hämmern','Side-Mages töten gibt Siphoned Energy (Mage-Raiden)']),1)}${D('Angriff und Verteidigung',L(['Viele Wände auf einer Seite öffnen, genug Platz zum Kiten schaffen','Eher von Süden nach Norden spielen, die Sicht ist besser','Gegen Overwall-Comps nie an der Wand stehen, gegen Melee Clap und Full Brawl darf man','Gates nur Person für Person passieren, sonst entstehen Clumps','Center-Mage ist für Angreifer die gefährlichste Zone, Kitewege vorher auf der Minimap planen']))}`,
outposts:()=>`<h2>Outposts <span class=tag>TODO</span></h2><p class=s>Stand der Informationen bei Patches prüfen.</p><div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom:12px;"><div class=card style="margin:0; border-left:4px solid #6cb2ff;"><b>Outpost als Defender</b><p class="mut" style="font-size:0.9rem; margin-top:8px;">Möchte man als Tank und Support die Chokes zu machen, um das Flüchten der Gegner zu vermeiden, während die Backline einzeln durch die Chokes geht um den Gegnerzerg zu fluten.</p></div><div class=card style="margin:0; border-left:4px solid #ff6b6b;"><b>Outpost als Attacker</b><p class="mut" style="font-size:0.9rem; margin-top:8px;">Gegen Kite & Clap wiederum möchte man sich als Verteidiger eher von den Wänden und den Chokes fernhalten und ggf. den Fight in die Open-World verlagern.</p></div></div>${D('Anmerkungen Outposts', `<ul><li>Outposts sind das "kleine" Castle.</li><li>Um einen Outpost zu übernehmen, muss man 3 Wellen mit steigender Schwierigkeit besiegen (6 Guards, 4 Elite Guards, 1 Lord).</li><li>Nach jeder Welle spawnen die nächsten nach genau einer Minute.</li><li>Nach der Lordphase darf maximal eine Gilde im "Cap-Kreis" stehen.</li><li>Kisten: 4 Raritätsstufen (grün/blau/lila/gold), spawnen wie im Castle.</li><li>Bei PvP um Outposts: Melee-Zerg -> Backline Richtung Norden (nicht über Wand angreifen).</li><li>Kämpft man gegen den Inhaber des Outposts, greifen zusätzlich die Guards an.</li></ul>`, 0)}`,
'open-world':()=>`<h2>Open World <span class=tag>TODO</span></h2><p class=s>Stand der Informationen bei Patches prüfen.</p>${D('Open World Fights', `<p>In Open World Fights wollen alle auf ihre Swaps tauschen. Bedenkt dabei den unterschiedlichen Playstyle gegen die diversen Comps.</p><p>Unsere Caller wollen häufig im Vorfeld Gegner scouten und dadurch übersteppen, catchen, dismounten und töten. Das sorgt für rapiden Stress beim Gegner, sowie das schnelle dezimieren der Gegnerzahl.</p><p>Zusätzlich kommen in Open-World-Fights mehrere Mechaniken zusammen: Clumps zu erzeugen und den Gegner zu zwingen, die völlig Spieler durch die immer wechselnde Terrain nicht auf ihrer Position agieren. Ebenfalls kann es dafür sorgen, dass es einen schnellen Umschwung der Taktik von Clump-Engage zu Brawl geben kann.</p><p>Anders ist im Fight gegen Clap/Kite: Diese Comp möchte sich von weiten Bereichen möglichst fernhalten und meistens über Wände, um Bends oder in Chokes hinein und laufen dabei in diese Richtungen. Da möchten wir in den einzelnen Rollenbeschreibungen, als Brawler, Tanks und Support, sowie vereinzelte Heiler aufmounten, den Gegnerzergs unterwegs sind, dismounten und sie halten. Gegen z.B. Brawl möchte man hingegen direkt die Healer fokussieren um danach die Brawler und zu guter Letzt die Tanks killen.</p>`, 1)}${D('Chokes', `<p>Der Begriff bezeichnet Engpässe in einem Spielbereich.</p><ul><li><b>Was ist das?</b> Ein Weg, Flur, eine Brücke, ein Tunnel oder ein Bereich zwischen mehreren Terrain durch die Teams zwingend hindurch müssen um zum Ziel zu gelangen.</li><li><b>Taktische Bedeutung:</b> Weil dort das gesamte gegnerische Team durch muss, konzentriert sich das Geschehen an diesen Punkten. Chokes werden oft als Engage-Point genutzt, daher immer wachsam sein.</li></ul>`)}`,
regeln:()=>`<h2>Regelwerk</h2><p class=s>Unsere Regeln für ein respektvolles Miteinander in der Gilde und der Allianz.</p><div class="card" style="border-left: 4px solid #c4a1ff; background: rgba(196,161,255,0.05); padding: 20px; margin-bottom: 24px;"><h3 style="margin-top:0; color:#c4a1ff; font-size:1.3rem;">Gildenregeln</h3><p class="mut" style="font-size:0.9em; margin-bottom:12px;">Diese Regeln sind das Fundament unserer Gemeinschaft und gelten für jeden.</p><ol style="padding-left:20px; margin:8px 0; font-size: 1.05em; line-height: 1.8; color: var(--fg);"><li>Wir sind eine Gemeinschaft, handelt danach!</li><li>Bringt keine Unruhe von außen in die Gildengemeinschaft hinein.</li><li>Wenn möglich priorisiert Content mit Gildenmembern.</li><li>The-Fallen ist eine Ü18 Gilde, daher wird ein erwachsener Umgangston erwartet.</li><li>Bei CTA dabei sein wenn Online. Wenn der Timer mit freiwillig gekennzeichnet ist entfällt die Pflicht.</li><li>Loot bei Gildenevents/ZVZ Timern beim HO oder Gildeninsel in die ZVZ Tabs abgeben.</li></ol></div><h3>Allianzregeln</h3>${D('Allianzregeln', `<h4>ROID Allianz Regeln</h4><p><b>1. Oberste Regel</b><br>Sei kein Arsch. Wir sind eine Allianz, teilt wo ihr könnt.</p><p><b>2. Vortexe/Cores</b><br>Die Gilde die das HQ HO auf der Map hat, hat Priorität auf den Core. Die Gilde die das HO + Terry besitzt hat Priorität auf den Vortex. Derzeit sind das Fen, Ravine und Mire.</p><p>Auf allen anderen Maps gilt, whoever takes it gets it. Mal hat der eine Glück und bekommt es mal der andere. Kein böses Blut! Sobald eine Gilde ein Objective bekommen hat, hat sie Prio auf das Objective. Kein stealen eines bereits getragenen Cores/Vortex.</p><p><b>3. Ressourcennodes, Kisten etc.</b><br>Teilt untereinander. Wir sind eine Allianz. Handelt danach.</p><p>Regelbrüche müssen per Videoproof bewiesen werden.</p><h4 style="margin-top:20px;">Regeln zu DIOR/Alllys</h4><p>Dior ist mit uns im ZVZ verbündet. Außerhalb gibt es keinen offiziellen NAP jedoch bitte ich euch euren Hausverstand zu nutzen. Gerade mit den Gilden Scourge of Gods und Family of Hefajstos pflegen wir ein diplomatisch gutes Verhältnis. Lasst Spieler dieser Gilden am Leben wenn ihr die Möglichkeit dazu habt.</p><p>Die beiden Gilden leben südlichwestlich von Widemoor Fen in Braemore Lowland und Sandmount Ascent. Diese Heimatgebiete sind für jegliche PVP Aktionen strikt zu meiden.</p><p>Allys die mit uns im ZVZ verbündet sein können: DIOR, II, XDXD -> wenn ZVZ Timer -> nicht hitten.</p><p>Für alles andere gilt Red = Dead.</p>`, 0)}`,
lootsplit:()=>`<h2>Lootsplit & Regear</h2><p class=s>Alle Infos zur Erstattung und zum Umgang mit Loot bei unseren ZvZ-Events.</p>
<h3>Regear-System</h3>
<div class=card><p style="margin-top:0">Allgemein gilt Regear im ZvZ bis <b>Stufe 8-9</b>. Das System ist dafür da, euch nach dem Content schnell wieder ins Spiel zu bringen.</p><ul><li><b>Waffen:</b> Wenn ihr mit einer Waffe eurer Wahl zum ZvZ erscheint, ist es nicht garantiert, dass diese im Regear-Pool verfügbar ist. <b>Bitte tragt eure Waffen möglichst eigenständig ins Hideout.</b></li><li><b>Rüstung, Helme, Capes & Schuhe:</b> Sollten ausreichend vorhanden sein. Wenn etwas fehlt, meldet euch bei <b>Relgok</b>.</li><li><b>Tränke & Food:</b> Es werden pro Person <b>4 Tränke und 1 Bufffood</b> regeared.</li></ul></div>
<h3 style="margin-top:40px;">Regear Vaults</h3>
<div class=card><p style="margin-top:0">Es gibt zwei unterschiedliche Regear Vaults im Hideout:</p><ul><li><b>ZVZ Rekruten:</b> Für Rekruten.</li><li><b>ZVZ Mitglieder:</b> Für Mitglieder.</li></ul><p class="mut" style="margin-bottom:0; font-size:0.9em;">Dank der Gildenrollen müsst ihr nicht selbst darauf achten: Rekruten haben Zugriff auf den Rekruten-Vault, Mitglieder haben durch ihre Rolle Zugriff auf beide Vaults.</p></div>
<h3 style="margin-top:40px;">Lootsplit</h3>
<div class=card><p style="margin-top:0">Der Loot, welcher während der ZvZs gesammelt wird, geht in den <b>ZvZ Loot-Abgabe Tab</b> im Hideout bzw. auf der Gildeninsel.</p><p>Dieser Loot wird verwendet, um <b>Battlemounts</b> sowie <b>Buyorders für das Regear-System</b> zu bezahlen.</p><p style="font-size:1.1em; font-weight:600; text-align:center; margin-top:24px; color:#c4a1ff;">Nur gemeinsam können wir die Gilde voranbringen!</p></div>
<div class=card style="border-left: 4px solid var(--mut);"><p style="margin:0;"><b>Ausnahme:</b> Jeder Content außerhalb von gecallten Events ist natürlich den Spielern überlassen, wie sie den Lootsplit regeln. Diese Regel gilt nur für offizielle ZvZ Events.</p></div>`,

    let id=location.hash.slice(1); if(!P[id] && !customContent[id])id='start';
    if (id.startsWith('admin') && !isAdmin) { adminLogin(); return; }
    
    // CUSTOM CONTENT INJEKTION
    let pageHtml = customContent[id] || (P[id] ? P[id]() : '');
    m.innerHTML = pageHtml;
    
    // Initialisierung (mit try/catch, falls durch den Editor Elemente fehlen)
    if (I[id]) {
        try { I[id](); } catch(e) { console.warn("Init Error for", id, e); }
    }
    
    const subPages = ['buffs','disarray','glossar','castles','terris','outposts','open-world','regeln','lootsplit','vod','settings'];
    A('nav a').forEach(a => { const targetId = subPages.includes(id) && id !== 'settings' ? 'erweitert' : id; a.classList.toggle('on', a.dataset.p == targetId); });
    nv.classList.remove('o'); $('#q').value=''; scrollTo(0,0);
}

$('#q').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    if(q.length === 0){ go(); return; }
    if(q.length < 2) return;
    const results = [];
    X.forEach(x => { const idx = x[2].toLowerCase().indexOf(q); if (idx >= 0) { results.push({ id: x[0], title: x[1], snippet: '…' + x[2].slice(Math.max(0, idx-50), idx+90) + '…' }); } });
    if (results.length === 0) { m.innerHTML = `<h2>Suche</h2><p class=mut>Nichts gefunden. Probiere einen anderen Begriff.</p>`; return; }
    const grouped = {};
    results.forEach(r => { if (!grouped[r.title]) grouped[r.title] = []; grouped[r.title].push(r); });
    let html = `<h2>Suchergebnisse für "${e.target.value}"</h2>`;
    for (const [title, items] of Object.entries(grouped)) {
        html += `<div class="search-section"><h3 class="cat-name">${title}</h3>`;
        items.forEach(item => { html += `<a href="#${item.id}" class="search-item"><b>${item.title}</b><span>${item.snippet}</span></a>`; });
        html += `</div>`;
    }
    m.innerHTML = html;
};

// FEEDBACK EVENTS
$('#feedback-btn').onclick = openFeedback;
$('#fb-cat').addEventListener('change', function() {
    const subcat = document.getElementById('fb-subcat');
    subcat.innerHTML = '<option value="">Bitte wählen...</option>';
    if(this.value) {
        subcat.disabled = false;
        FB_CATS[this.value].forEach(sub => {
            const opt = document.createElement('option');
            opt.value = sub; opt.textContent = sub;
            subcat.appendChild(opt);
        });
    } else {
        subcat.disabled = true;
    }
});
$('#settings-btn').onclick=()=>{ location.hash = '#settings'; };

// Initial Load
loadCustomContent().then(() => {
    addEventListener('hashchange',go);go();
});
</script></body></html>
