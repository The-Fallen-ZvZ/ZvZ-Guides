<script>
(function(){
    try{
        var s=JSON.parse(localStorage.getItem('tf-settings')||'{}');
        var t=s.theme||'dark';
        if(t==='system') t = matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
        var root = document.documentElement;
        root.dataset.theme = t;
        if(s.borderWidth) root.style.setProperty('--bw', s.borderWidth+'px');
        if(s.radius!=null){
            var r = s.radius;
            root.style.setProperty('--r-sm', Math.round(Math.min(8, r*0.67))+'px');
            root.style.setProperty('--r-md', r+'px');
            root.style.setProperty('--r-lg', Math.round(Math.min(16, r*1.33))+'px');
            root.style.setProperty('--r-pill', Math.max(12, Math.round(r*1.67))+'px');
        }
        if(s.borderColor) root.style.setProperty('--ln', s.borderColor);
        if(s.accent) root.style.setProperty('--accent', s.accent);
        if(s.fontSize==='small') root.dataset.font='small';
        else if(s.fontSize==='large') root.dataset.font='large';
        root.dataset.compact = s.compact ? '1' : '0';
        root.dataset.motion = s.reduceMotion ? 'off' : 'on';
    }catch(e){}
})();
</script>
<style>

/* ============================================================
   SETTINGS
   ============================================================ */
const SETTINGS_KEY = 'tf-settings';
const DEFAULT_SETTINGS = {theme:'dark',borderColor:null,borderWidth:1,radius:12,accent:null,fontSize:'normal',compact:false,reduceMotion:false};
let settings = {...DEFAULT_SETTINGS};

function loadSettings(){
    try{
        const raw = localStorage.getItem(SETTINGS_KEY);
        if(raw){ settings = {...DEFAULT_SETTINGS, ...JSON.parse(raw)}; }
        else{
            const oldTheme = localStorage.getItem('th');
            if(oldTheme === 'light' || oldTheme === 'dark') settings.theme = oldTheme;
            saveSettings();
        }
    }catch(e){}
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }
function getEffectiveTheme(){ return settings.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : settings.theme; }
function getDefaultBorderColor(){ return getEffectiveTheme() === 'light' ? '#e3e3e3' : '#262626'; }
function getEffectiveBorderColor(){ return settings.borderColor || getDefaultBorderColor(); }
function getEffectiveAccent(){ return settings.accent || '#c4a1ff'; }

function applySettings(){
    const root = document.documentElement;
    root.dataset.theme = getEffectiveTheme();
    if(settings.borderColor) root.style.setProperty('--ln', settings.borderColor); else root.style.removeProperty('--ln');
    root.style.setProperty('--bw', settings.borderWidth + 'px');
    const r = settings.radius;
    root.style.setProperty('--r-sm', Math.round(Math.min(8, r * 0.67)) + 'px');
    root.style.setProperty('--r-md', r + 'px');
    root.style.setProperty('--r-lg', Math.round(Math.min(16, r * 1.33)) + 'px');
    root.style.setProperty('--r-pill', Math.max(12, Math.round(r * 1.67)) + 'px');
    if(settings.accent) root.style.setProperty('--accent', settings.accent); else root.style.removeProperty('--accent');
    if(settings.fontSize === 'small') root.dataset.font = 'small';
    else if(settings.fontSize === 'large') root.dataset.font = 'large';
    else delete root.dataset.font;
    root.dataset.compact = settings.compact ? '1' : '0';
    root.dataset.motion = settings.reduceMotion ? 'off' : 'on';
}

loadSettings();
applySettings();

try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if(settings.theme === 'system') applySettings(); }); }catch(e){}

/* ============================================================
   COLOR PICKER
   ============================================================ */
function hexToHsv(hex){
    hex = hex.replace('#',''); if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
    const r=parseInt(hex.substr(0,2),16)/255, g=parseInt(hex.substr(2,2),16)/255, b=parseInt(hex.substr(4,2),16)/255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    const v=max, s=max===0?0:d/max;
    let h=0;
    if(d!==0){
        if(max===r) h=60*(((g-b)/d)%6);
        else if(max===g) h=60*((b-r)/d+2);
        else h=60*((r-g)/d+4);
    }
    if(h<0) h+=360;
    return {h,s,v};
}
function hsvToHex(h,s,v){
    const c=v*s, x=c*(1-Math.abs(((h/60)%2)-1)), m=v-c;
    let r,g,b;
    if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
    else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
    const t=n=>Math.round((n+m)*255).toString(16).padStart(2,'0');
    return '#'+t(r)+t(g)+t(b);
}

function openColorPicker(anchor, currentColor, onChange, onAuto){
    document.querySelectorAll('.color-picker-popover').forEach(el=>el.remove());
    const init = hexToHsv(currentColor);
    let state = {h:init.h, s:init.s, v:init.v};

    const pop = document.createElement('div');
    pop.className = 'color-picker-popover';
    pop.innerHTML = `
        <div class="cp-wheel">
            <div class="cp-ring"></div>
            <div class="cp-sv"></div>
            <div class="cp-hue-cursor"></div>
            <div class="cp-sv-cursor"></div>
        </div>
        <div class="cp-hex-row">
            <span class="cp-hex-label">HEX</span>
            <input type="text" class="cp-hex-input" value="${currentColor}" maxlength="7" spellcheck="false">
        </div>
        <div class="cp-presets">
            ${['#262626','#3a3a3a','#555555','#888888','#cccccc','#e3e3e3','#f5f5f5','#ffffff'].map(c=>`<button data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}
        </div>
        <div class="cp-actions">
            <button class="auto-btn">Auto</button>
            <button class="primary ok-btn">OK</button>
        </div>
    `;
    document.body.appendChild(pop);

    const ring = pop.querySelector('.cp-ring');
    const sv = pop.querySelector('.cp-sv');
    const hueCur = pop.querySelector('.cp-hue-cursor');
    const svCur = pop.querySelector('.cp-sv-cursor');
    const hexInput = pop.querySelector('.cp-hex-input');

    function render(){
        const angle = state.h * Math.PI / 180;
        hueCur.style.left = (120 + 104 * Math.sin(angle)) + 'px';
        hueCur.style.top  = (120 - 104 * Math.cos(angle)) + 'px';
        hueCur.style.background = `hsl(${state.h},100%,50%)`;
        sv.style.setProperty('--cp-hue', `hsl(${state.h},100%,50%)`);
        svCur.style.left = (60 + state.s * 120) + 'px';
        svCur.style.top  = (60 + (1-state.v) * 120) + 'px';
        svCur.style.background = hsvToHex(state.h, state.s, state.v);
        if(document.activeElement !== hexInput) hexInput.value = hsvToHex(state.h, state.s, state.v);
    }
    function commit(){ onChange(hsvToHex(state.h, state.s, state.v)); }

    let ringDrag = false;
    ring.addEventListener('pointerdown', e=>{
        const rect = ring.getBoundingClientRect();
        const dx = e.clientX - (rect.left + rect.width/2);
        const dy = e.clientY - (rect.top + rect.height/2);
        const dist = Math.hypot(dx,dy);
        const scale = rect.width / 240;
        if(dist < 90*scale || dist > 118*scale) return;
        ringDrag = true; ring.setPointerCapture(e.pointerId); e.preventDefault(); updateHue(e);
    });
    ring.addEventListener('pointermove', e=>{ if(ringDrag) updateHue(e); });
    ring.addEventListener('pointerup', e=>{ ringDrag=false; try{ring.releasePointerCapture(e.pointerId);}catch(_){} });
    ring.addEventListener('pointercancel', ()=>{ ringDrag=false; });
    function updateHue(e){
        const rect = ring.getBoundingClientRect();
        const dx = e.clientX - (rect.left + rect.width/2);
        const dy = e.clientY - (rect.top + rect.height/2);
        state.h = (Math.atan2(dy,dx) * 180/Math.PI + 90 + 360) % 360;
        render(); commit();
    }

    let svDrag = false;
    sv.addEventListener('pointerdown', e=>{ svDrag=true; sv.setPointerCapture(e.pointerId); e.preventDefault(); updateSV(e); });
    sv.addEventListener('pointermove', e=>{ if(svDrag) updateSV(e); });
    sv.addEventListener('pointerup', e=>{ svDrag=false; try{sv.releasePointerCapture(e.pointerId);}catch(_){} });
    sv.addEventListener('pointercancel', ()=>{ svDrag=false; });
    function updateSV(e){
        const rect = sv.getBoundingClientRect();
        state.s = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        state.v = Math.max(0, Math.min(1, 1 - (e.clientY - rect.top) / rect.height));
        render(); commit();
    }

    hexInput.addEventListener('input', ()=>{
        let val = hexInput.value.trim();
        if(!val.startsWith('#')) val = '#'+val;
        if(/^#[0-9a-fA-F]{6}$/.test(val) || /^#[0-9a-fA-F]{3}$/.test(val)){
            state = hexToHsv(val); render(); commit();
        }
    });
    pop.querySelectorAll('.cp-presets button').forEach(b=>b.addEventListener('click', ()=>{
        state = hexToHsv(b.dataset.color); render(); commit();
    }));
    pop.querySelector('.auto-btn').addEventListener('click', ()=>{ onAuto(); cleanup(); });
    pop.querySelector('.ok-btn').addEventListener('click', cleanup);

    function position(){
        pop.style.visibility='hidden';
        const ar = anchor.getBoundingClientRect();
        const pr = pop.getBoundingClientRect();
        let left = ar.left;
        let top = ar.bottom + 8;
        if(top + pr.height > innerHeight - 8) top = Math.max(8, ar.top - pr.height - 8);
        if(left + pr.width > innerWidth - 8) left = innerWidth - pr.width - 8;
        if(left < 8) left = 8;
        pop.style.left = left+'px';
        pop.style.top = top+'px';
        pop.style.visibility='visible';
    }
    if(innerWidth < 500){
        pop.style.left='8px'; pop.style.right='8px'; pop.style.top='auto'; pop.style.bottom='16px'; pop.style.width='calc(100% - 16px)';
    } else { position(); }

    function outside(e){
        if(!pop.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) cleanup();
    }
    setTimeout(()=>document.addEventListener('click', outside), 0);
    function cleanup(){ pop.remove(); document.removeEventListener('click', outside); }

    render();
}

function initSettings(){
    const themeSeg = document.querySelector('[data-setting="theme"]');
    if(themeSeg) themeSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{
        settings.theme = btn.dataset.v; saveSettings(); applySettings();
        themeSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn));
    }));
    const bwSeg = document.querySelector('[data-setting="borderWidth"]');
    if(bwSeg) bwSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{
        settings.borderWidth = parseInt(btn.dataset.v); saveSettings(); applySettings();
        bwSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn));
    }));
    const radiusInput = document.querySelector('[data-setting="radius"]');
    if(radiusInput) radiusInput.addEventListener('input', e=>{
        settings.radius = parseInt(e.target.value); saveSettings(); applySettings();
        const lbl = e.target.parentElement.querySelector('.range-val');
        if(lbl) lbl.textContent = settings.radius + ' px';
    });
    const fsSeg = document.querySelector('[data-setting="fontSize"]');
    if(fsSeg) fsSeg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', ()=>{
        settings.fontSize = btn.dataset.v; saveSettings(); applySettings();
        fsSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn));
    }));
    const compactInput = document.querySelector('[data-setting="compact"]');
    if(compactInput) compactInput.addEventListener('change', e=>{ settings.compact = e.target.checked; saveSettings(); applySettings(); });
    const motionInput = document.querySelector('[data-setting="reduceMotion"]');
    if(motionInput) motionInput.addEventListener('change', e=>{ settings.reduceMotion = e.target.checked; saveSettings(); applySettings(); });

    const borderBtn = document.querySelector('[data-setting="borderColor"]');
    if(borderBtn) borderBtn.addEventListener('click', e=>{
        e.stopPropagation();
        openColorPicker(borderBtn, getEffectiveBorderColor(),
            c=>{ settings.borderColor=c; saveSettings(); applySettings();
                 const s=borderBtn.querySelector('.color-swatch'), l=borderBtn.querySelector('.color-swatch-label');
                 if(s)s.style.background=c; if(l)l.textContent=c; },
            ()=>{ settings.borderColor=null; saveSettings(); applySettings();
                  const c=getEffectiveBorderColor();
                  const s=borderBtn.querySelector('.color-swatch'), l=borderBtn.querySelector('.color-swatch-label');
                  if(s)s.style.background=c; if(l)l.textContent='Auto'; });
    });
    const accentBtn = document.querySelector('[data-setting="accent"]');
    if(accentBtn) accentBtn.addEventListener('click', e=>{
        e.stopPropagation();
        openColorPicker(accentBtn, getEffectiveAccent(),
            c=>{ settings.accent=c; saveSettings(); applySettings();
                 const s=accentBtn.querySelector('.color-swatch'), l=accentBtn.querySelector('.color-swatch-label');
                 if(s)s.style.background=c; if(l)l.textContent=c; },
            ()=>{ settings.accent=null; saveSettings(); applySettings();
                  const c=getEffectiveAccent();
                  const s=accentBtn.querySelector('.color-swatch'), l=accentBtn.querySelector('.color-swatch-label');
                  if(s)s.style.background=c; if(l)l.textContent='Standard'; });
    });
    const resetBtn = document.getElementById('set-reset-btn');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{
        if(!confirm('Alle Einstellungen auf Standard zurücksetzen?')) return;
        settings = {...DEFAULT_SETTINGS}; saveSettings(); applySettings(); go();
    });
}

const FB_CATS = {
    'Startseite': ['Allgemein', 'Design', 'Bug-Report'],
    'ZvZ-Basics': ['Mindestvoraussetzungen', 'Positionierung', 'Bewegung & Formation', 'Party-Größen', 'Albion Settings'],
    'Comps': ['Grundkonzept', 'Positionierung (Kreis)', 'Main Engage', 'Brawl Druck', 'Bait & Switch', 'Flood', 'Konter-Taktiken'],
    'Rollen': ['Caller', 'Tanks', 'Supports', 'DPS', 'Healer', 'Battlemounts'],
    'Waffen & BMs': ['Tanks', 'Supports', 'Support DPS', 'Clap DDs', 'Brawl DDs', 'Healer', 'Battlemounts'],
    'Erweitert': ['Buffs & Debuffs', 'Disarray', 'Call-Glossar', 'Castles', 'Territories', 'Outposts', 'Open World', 'Regeln', 'Lootsplit', 'VODs'],
    'Sonstiges': ['Feedback zur Seite', 'Feature-Wunsch', 'Lob']
};

function openFeedback(){
    document.getElementById('feedback-modal').classList.add('open');
    const catSelect = document.getElementById('fb-cat');
    if(catSelect.options.length <= 1){
        Object.keys(FB_CATS).forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat; opt.textContent = cat;
            catSelect.appendChild(opt);
        });
    }
    const draft = localStorage.getItem('fb-draft');
    if(draft) document.getElementById('fb-msg').value = draft;
}

function closeFeedback(){
    document.getElementById('feedback-modal').classList.remove('open');
    document.getElementById('fb-status').textContent = '';
}

async function submitFeedback(){
    const cat = document.getElementById('fb-cat').value;
    const subcat = document.getElementById('fb-subcat').value;
    const msg = document.getElementById('fb-msg').value.trim();
    const statusEl = document.getElementById('fb-status');

    if(!cat || !subcat || msg.length < 10) {
        statusEl.textContent = 'Bitte alle Felder ausfüllen (min. 10 Zeichen).';
        statusEl.style.color = '#ff6b6b';
        return;
    }

    if(!FEEDBACK_ENDPOINT){
        statusEl.textContent = 'Testmodus: Nachricht lokal gespeichert (Discord nicht verbunden).';
        statusEl.style.color = '#5fd38a';
        setTimeout(closeFeedback, 3000);
        return;
    }

    statusEl.textContent = 'Wird gesendet...';
    statusEl.style.color = 'var(--mut)';

    try {
        const res = await fetch(FEEDBACK_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category: cat, subcategory: subcat, message: msg })
        });
        if(!res.ok) throw new Error('Server-Fehler');
        
        localStorage.removeItem('fb-draft');
        document.getElementById('fb-msg').value = '';
        
        statusEl.textContent = 'Erfolgreich gesendet! Vielen Dank.';
        statusEl.style.color = '#5fd38a';
        setTimeout(closeFeedback, 3000);
    } catch (e) {
        statusEl.textContent = 'Fehler beim Senden. Bitte später erneut versuchen.';
        statusEl.style.color = '#ff6b6b';
    }
}

function initAdminFeedback() {
    const container = document.getElementById('admin-feedback-content');
    if(!container) return;

    const modKey = sessionStorage.getItem('feedbackModKey');
    if(!modKey) {
        container.innerHTML = '<p class="mut">Bitte erneut über den Moderatoren-Login anmelden.</p>';
        return;
    }
    container.innerHTML = '<p class="mut">Lade Feedback...</p>';

    fetch(`${FEEDBACK_ENDPOINT}/?key=${encodeURIComponent(modKey)}`)
        .then(res => {
            if(res.status === 401) { sessionStorage.removeItem('feedbackModKey'); sessionStorage.removeItem('isAdmin'); throw new Error('Auth failed'); }
            if(!res.ok) throw new Error('Server error');
            return res.json();
        })
        .then(data => {
            if(!data || data.length === 0) {
                container.innerHTML = '<p class="mut">Noch kein Feedback vorhanden.</p>';
                return;
            }
            
            const grouped = {};
            data.forEach(item => {
                if(!grouped[item.category]) grouped[item.category] = {};
                if(!grouped[item.category][item.subcategory]) grouped[item.category][item.subcategory] = [];
                grouped[item.category][item.subcategory].push(item);
            });

            let html = '';
            for(const [mainCat, subCats] of Object.entries(grouped)) {
                let subHtml = '';
                for(const [subCat, items] of Object.entries(subCats)) {
                    subHtml += `<h4 style="margin-top:16px; margin-bottom:8px; font-size:1rem; color:var(--fg);">${subCat}</h4>`;
                    items.forEach(item => {
                        const date = new Date(item.timestamp || Date.now()).toLocaleString('de-DE');
                        subHtml += `<div class="feedback-item">
                            <div class="feedback-header">
                                <span class="feedback-cat">${item.category} &rsaquo; ${item.subcategory}</span>
                                <span>${date}</span>
                            </div>
                            <div class="feedback-msg">${item.message.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                        </div>`;
                    });
                }
                html += `<details><summary>${mainCat}</summary><div class="db">${subHtml}</div></details>`;
            }
            container.innerHTML = html;
        })
        .catch(err => {
            console.error(err);
            container.innerHTML = '<p class="mut" style="color:#ff6b6b;">Fehler beim Laden. Key ungültig oder Server nicht erreichbar. Bitte neu anmelden.</p>';
        });
}

        <p class="mut" style="font-size:0.9em; margin-bottom:8px;">Tipp: Ändere nur den Text, nicht die spitzen Klammern (z.B. &lt;details&gt; oder &lt;b&gt;), sonst bricht das Layout.</p>
        <div id="editor-workspace" class="editor-workspace" contenteditable="true"></div>
    `;

    window.loadEditorContent = (key) => {
        const pageId = document.getElementById('editor-page-select').value;
        if(!pageId) return alert("Bitte eine Seite wählen.");
        
        const workspace = document.getElementById('editor-workspace');
        workspace.innerHTML = customContent[pageId] || (P[pageId] ? P[pageId]() : '');
    };

    window.saveEditorContent = async (key) => {
        const pageId = document.getElementById('editor-page-select').value;
        if(!pageId) return alert("Bitte eine Seite wählen.");
        
        const html = document.getElementById('editor-workspace').innerHTML;
        
        try {
            const res = await fetch(CUSTOM_CONTENT_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, pageId: pageId, html: html })
            });
            if(res.ok) {
                alert("Erfolgreich gespeichert! Die Änderungen sind ab sofort für alle sichtbar.");
                customContent[pageId] = html;
                if(location.hash === '#' + pageId) go();
            } else {
                alert("Fehler beim Speichern (Falscher Key?).");
            }
        } catch(e) { alert("Netzwerkfehler beim Speichern."); }
    };

    window.resetEditorContent = async (key) => {
        const pageId = document.getElementById('editor-page-select').value;
        if(!pageId) return alert("Bitte eine Seite wählen.");
        if(!confirm("Möchtest du die Anpassungen für diese Seite wirklich löschen?")) return;
        
        try {
            const res = await fetch(CUSTOM_CONTENT_ENDPOINT, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key, pageId: pageId })
            });
            if(res.ok) {
                alert("Auf Standard zurückgesetzt!");
                delete customContent[pageId];
                document.getElementById('editor-workspace').innerHTML = P[pageId] ? P[pageId]() : '';
                if(location.hash === '#' + pageId) go();
            } else {
                alert("Fehler beim Zurücksetzen.");
            }
        } catch(e) { alert("Netzwerkfehler beim Zurücksetzen."); }
    };
}

let isAdmin = sessionStorage.getItem('isAdmin') === 'true';
async function adminLogin(e){
    if(e) e.preventDefault();
    if (isAdmin) { if (!location.hash.startsWith('#admin')) location.hash = '#admin'; return; }

    let modKey = sessionStorage.getItem('feedbackModKey');
    if (!modKey) {
        modKey = prompt("Bitte Moderatoren-Key eingeben:");
        if (!modKey) return;
        modKey = modKey.trim();
    }
    if (!modKey) return;

    let ok = false;
    try {
        const res = await fetch(`${FEEDBACK_ENDPOINT}/?key=${encodeURIComponent(modKey)}`);
        ok = res.ok;
    } catch (err) { ok = false; }

    if (!ok) {
        sessionStorage.removeItem('feedbackModKey');
        alert("Moderatoren-Key ungültig oder Server nicht erreichbar.");
        return;
    }

    sessionStorage.setItem('feedbackModKey', modKey);
    sessionStorage.setItem('isAdmin', 'true');
    isAdmin = true;
    if (!location.hash.startsWith('#admin')) history.replaceState(null, '', '#admin');
    go();
}
function adminLogout(e){ e.preventDefault(); isAdmin = false; sessionStorage.removeItem('isAdmin'); sessionStorage.removeItem('feedbackModKey'); location.hash = '#start'; location.reload(); }

    'Shadowcaller': 'E kommt auf 5! Dein Positioning ist wichtig, damit du immer nah genug am Caller stehst um auf ihn die E zu drücken, aber dich durch dieses Positioning nicht zu viel in Gefahr begibst.',
    'Incubus': 'Die Incubus ist eine der wichtigsten Rollen und wird in zwei Subrollen aufgeteilt: DPS und Support. Der DPS-Part ist dabei der wichtigere und sollte immer priorisiert werden.<br><br>DPS: Die E muss treffen, nachdem die Gegner geclumpt wurden, aber noch vor dem Main-DMG. Der ideale Zeitpunkt ist meistens bei Count 2. Durch die Blink-Schuhe kann man entweder am Rand oder im inneren Kreis stehen, sollte sich aber niemals auf dem Caller positionieren. Meistens ist die Mitte besser, da man dem Caller mit den Schuhen nicht immer schnell genug hinterherkommt, wenn dieser auf der gegenüberliegenden Seite engaged.<br><br>Support: Der Support-Part besteht hauptsächlich darin, die Grune entweder auf Chokes zu setzen, durch die die Verbündeten laufen müssen, oder direkt auf den Engage, damit sich die geclumpten Spieler nach dem Cleanse wieder bewegen können.<br><br>Das zweite wichtige Support-Tool ist die Demon Armor. Diese senkt die eigenen Resistenzen auf Cloth-Leder-Niveau, gibt dafür aber bis zu 9 Verbündeten zusätzliche Resistenzen. Wenn man alleine demoned, muss man eine Gig-Pot nutzen, da man sonst stirbt. Wenn mehrere Spieler auf einen Engage demonen, kann die Incubus aufgrund der vielen Defensivwerte, beispielsweise durch passive Stats von Mace und Aegis, auch auf den Gig-Pot verzichten.<br><br>Gegen Brawl wird die Demon Armor hauptsächlich gegen Galas oder Astral-Stäbe eingesetzt. Man erkennt deren Engage meistens daran, dass sie Soldier Armor spielen und dadurch vor ihrem Engage rot aufleuchten. Teilweise spielen sie allerdings auch Taunt auf ihren Rüstungen. In diesem Fall muss besonders auf die Animation geachtet werden.<br><br>Kleiner Tipp: Beim Resetten immer die Guard Rune unter sich setzen, da man dadurch schwieriger unterbrochen wird und nach dem Resetten immer wieder der eine Up hat und nicht vergessen das die Incubus Cast Time hat.',
    'Realmbreaker': 'Der Realmbreaker wird an der Seite des Zergs gespielt. Durch die W kann man enorme Distanzen zurücklegen. Die Schuhe werden auf 4 gezündet damit man durch CC durchkommt, ohne aufgehalten zu werden. Die E wird so getimed das sie auf 2 hittet. WICHTIG: Nie E drücken wenn der Clump noch nicht gemacht wurde da der Knock-Up den Clump zerstört da die Gegner dann nicht gepulled werden. Den DMG zu hitten ist gut aber nicht die Priorität, diese liegt auf dem HP-Cut.',
    'Spiked': 'Dein Job ist es, den Clump mit deiner E zu hitten. Davor solltest du deine W nutzen um die defensiven Stats der Passive zu bekommen. Deine Jacket of Tenacity drückst du auf ein Magic-Damage-Ally, z.B. deinen GA-Beamer, oder aber auch Perma/Dawnsong. Nach dem Clap full defensive spielen und sich "verstecken". Ohne einen Spiked ist es extrem schwierig, Clumps effektiv zu killen, also bleib unbedingt am Leben. Wenn der Caller nach Cooldowns fragt, antwortest du, dein E Cooldown ist einer der längsten.',
    'Longbow': 'Erst W dann E auf den Clump. Vor der E die Boots of Valor zünden und falls man auf Jacket of Tenacity spielt, die Rüstung auf einen Magic-Damage-Ally zünden, z.B. Perma/Dawnsong. Die Guardian Armor ist ein defensives Tool und soll nicht mit dem Clap genutzt werden. Nie Guardian Armor nutzen während des Engages.',
    'Perma': 'Erst E dann W auf den Clump, gegen Brawl auch auf die Blink-W swappen für mehr defensive Tools. Casttime Passive und diese mit Qs so stacken, dass diese für die E aktiv ist.',
    'Dawnsong': 'E auf den Clump, dafür die Passive bereithalten. Die W kann gut auf low Targets oder Healer genutzt werden.',
    'Demonfang': 'Stacks bereithalten für den Clap, auf den Clap W und dann 2 Es. Die dritte E ist in der Regel nicht zu nutzen, außer du bist confident, dass du kein Problem mit dem Self-Bleeding hast. Nie Guardian Armour nutzen während des Engages.',
    'Galatine Pair (Offtimer)': 'Diese werden nur mit Erfahrung und vorheriger Absprache mit Relgok oder Takumoto gespielt. Dein Job ist es, Druck auf den Gegner auszuüben und gegnerische Defensives zu forcen. Erst Soldier Armor+Passive stacken und dann einen unabhängigen Clump hitten.',
    'Tank Hallowfall Royal': 'Halte dich und den Zerg am Leben. Deine Royal Armor auf Cooldown in Gegnern nutzen. Nutze das E hauptsächlich als defensives Movement-Tool, nur im Notfall als Heilung.',
    'Tank Hallowfall': 'Halte dich und den Zerg am Leben. Nutze das E hauptsächlich als defensives Movement-Tool, nur im Notfall als Heilung.',
    'Exalted': 'Halte dich und den Zerg am Leben. Deine E wird hauptsächlich offensiv genutzt. Dies ermöglicht das Entfernen von unter anderem Silence-Feldern, Slow-Ringen oder Behemoth Puddles.',
    'Exalted (Plate)': 'Halte dich und den Zerg am Leben. Deine E wird hauptsächlich offensiv genutzt. Dies ermöglicht das Entfernen von unter anderem Silence-Feldern, Slow-Ringen oder Behemoth Puddles. Deine Royal Armor auf Cooldown in Gegnern nutzen.',
    '1H Nature': 'Halte dich und den Zerg am Leben. Deine W into E heilt extrem viele Leute gleichzeitig um eine große Menge, applied aber auch schnell Healing Sickness, also nicht nutzen, wenn eh alle Full-HP sind.',
    '1H Holy': 'Halte dich und den Zerg am Leben. Nutze das E quasi auf Cooldown, dies erhöht den Heal-Output extrem. Diese Rolle ist deutlich verwundbarer als ein Hallowfall.'
};

const BM_CONTEXT = {
    'Battle Eagle': `<h4>Q: Favorable Wind (Buff)</h4><p>Erschafft einen Rückenwind mit 10m Radius am Zielort. Erhöht die Cooldown-Rate von bis zu 20 Verbündeten um 6% für 10s (stapelt bis zu 2 mal).</p><h4>W: Storm Wall (Crowd Control)</h4><p>Erschafft eine 16m breite Sturmwand 5m vor dir. Wirft alle Gegner, die sie berühren, 11.2m zurück (Knockback) und purged alle Buffs (außer Heilung über Zeit) für bis zu 3s (Channel).</p><h4>E: Lightning Storm (Damage / Crowd Control)</h4><p>Beschwört einen Blitzsturm mit 7m Radius am Zielort, der sich 5m wegbewegt und 5s lang hält. Verursacht 236 magischen Schaden an allen Gegnern und unterbricht deren Zauber.</p><h4>F: Battle Mount Gallop (Buff)</h4><p>Erhöht deine Bewegungsgeschwindigkeit um 90%. Du bist während des Galopps gesilenced. Der Effekt hält 4s nach dem Stoppen an. Wird unterbrochen, wenn du Schaden nimmst.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Backline BM. Teile dein Team auf und gib Q zu verschiedenen Zeiten, da es nicht stapelt. Die W ist ein massiver Knockback und Purge, ideal gegen Engages. Die E cancelt Casts (z.B. Command Mammoth) und verursacht guten Schaden.</p>`,
    'Tower Chariot': `<h4>Q: Energy Cloud (Buff)</h4><p>Schleudert eine Energiekugel (10m Radius), die 8 Energie pro Sekunde für 10s an bis zu 20 Verbündete wiederherstellt (stapelt bis zu 2 mal).</p><h4>W: Toxic Crystal Waste (Debuff)</h4><p>Rollt ein Fass mit giftigem Kristallabfall hinter dir her. Bei Aufprall explodiert es (12m Radius) und verringert den verursachten Schaden aller getroffenen Gegner um 40% für 6s.</p><h4>E: Tower Shield (Buff)</h4><p>Erschafft einen Energieschild (12m Radius) um dich herum. Erhöht die Verteidigung gegen Spieler von bis zu 25 Verbündeten (inkl. Mounts) um 23.077% für bis zu 12s (Channel, nicht unterbrechbar).</p><h4>F: Battle Mount Gallop (Buff)</h4><p>Erhöht deine Bewegungsgeschwindigkeit um 90%. Du bist während des Galopps gesilenced. Der Effekt hält 4s nach dem Stoppen an. Wird unterbrochen, wenn du Schaden nimmst.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Die Manaquelle des Zergs. Wenn du Q spammst, hat niemand Manaprobleme. Die Kombination aus W (Damage-Reduktion) und E (Defensive) absorbiert massiven Schaden. Achte darauf, mit dem Rücken zum Team zu stehen, damit das Fass in die Reihen des Gegners rollt. Vorsicht vor Behemoth (Barrel dodgen).</p>`,
    'Venom Basilisk': `<h4>Q: Poison Cloud (Debuff)</h4><p>Feuert einen Giftblitz am Zielort ab (10m Radius). Verringert den verursachten Schaden aller getroffenen Gegner um 20% für 10s.</p><h4>E: Intoxicating Breath (Damage / Debuff)</h4><p>Stößt einen giftigen Atem in einem Kegel vor dir aus. Verursacht 241 magischen Schaden und verringert die Verteidigung gegen alles von getroffenen Gegnern um 33% für 7s.</p><h4>F: Battle Mount Gallop (Buff)</h4><p>Erhöht deine Bewegungsgeschwindigkeit um 75%. Du bist während des Galopps gesilenced. Der Effekt hält 4s nach dem Stoppen an. Wird unterbrochen, wenn du Schaden nimmst.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Extrem starker Pierce (E), der das gegnerische Ziel verwundbar macht. Der Q reduziert den gegnerischen Schaden. Sehr stark in Terry-Fights, aber teuer und risikoanfällig. Achte auf Cleanse des Gegners.</p>`,
    'Colossus Beetle': `<h4>Q: Defensive Blow (Damage / Debuff / Buff)</h4><p>Greift den Gegner an (204 physischer Schaden). Verringert die CC-Resistenz um 20% für 8s (stapelt bis zu 3 mal). Erhöht gleichzeitig die Verteidigung gegen alles von bis zu 20 Verbündeten (12m Radius) um 13.043%.</p><h4>W: Onslaught (Damage / Crowd Control / Buff / Mobility)</h4><p>Fliegt zum Zielort (immun gegen Debuffs und CC). Hinterlässt eine 8m breite Spur für 3s (erhöht die Bewegungsgeschwindigkeit von Verbündeten um 50%). Verursacht 263 physischen Schaden (6m Radius) und wirft Gegner für 0.6s in die Luft (Knock-up).</p><h4>E: Beetle Buzz (Crowd Control)</h4><p>Wirbelt Staub auf (9m Radius). Verlangsamt alle Gegner um 10% und silenced sie für bis zu 5s (Channel).</p><h4>F: Flight (Buff)</h4><p>Beginnt zu fliegen (Bewegungsgeschwindigkeit +110%). Verringert deine Verteidigung gegen alles um 110% und deine CC-Resistenz um 200%. Wenn du aufhörst zu fliegen, wirst du für 4s gesilenced.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Sehr mobil. W kann offensiv (Knock-up) oder defensiv (Kiten) genutzt werden. Die E kann Engages stoppen oder den Clump des Callers silencen. F gibt dir keine Tag-Bubble (Vorsicht vor Aggro).</p>`,
    'Command Mammoth': `<h4>Fähigkeiten (High Command / Buffs)</h4><p>Das teuerste und stärkste BM. <b>High Command (90s CD):</b> Massiver Damage-Boost. <b>Defensive Shield:</b> Schützt Verbündete. <b>AOE Knockback:</b> Einer der stärksten Interrupts im Spiel. <b>Wichtig:</b> Der Cooldown zum Aufsteigen ist 90s (statt 30s). Jede HP-Leiste entspricht 18s Cooldown.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Wird oft in Bomb Squads oder im Main Zerg gespielt. Nutze High Command auf Call. Sei dir bewusst, dass der Gegner dich mit dem Battle Eagle (E) oder durch Dismount (Ballista) hart fokussieren wird.</p>`,
    'Siege Ballista': `<h4>Fähigkeiten (Anti-BM)</h4><p>Single-Target Anti-Tank und Anti-Battlemount. Zwei Ballistas können einen Command Mammoth in unter einer Minute dismounten. Der Channel kann durch Silences (z.B. Arcane Q) unterbrochen werden.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Deine einzige Aufgabe ist es, gegnerische BMs zu dismounten und aus dem Fight zu halten. Habt ihr das gegnerische Chariot dismounted, jagt es den Rest des Fights.</p>`,
    'Behemoth': `<h4>Q: Dismount</h4><p>Nutze dies ausschließlich auf gegnerische Battlemounts, um sie zu dismounten und zum Reset zu zwingen.</p><h4>W: Disrupt</h4><p>Stört gegnerische Engages.</p><h4>E: Silence</h4><p>Silence auf Chokes oder um Bomb Squads zu stoppen.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Der Anti-Tank / Anti-BM. Halte gegnerische BMs so lange wie möglich aus dem Fight. Dein E ist extrem stark gegen Engages. Mit Exalted Stuff counterbar.</p>`,
    'Roving Bastion': `<h4>Q: 3 Lasers</h4><p>Feuert 3 Laser ab. Der dritte Laser stunnt Gegner. Behalte Stacks auf den gegnerischen DPS im Auge.</p><h4>W: Defensive</h4><p>Ähnlich wie eine riesige Judicator Armor. Gibt Resistenzen an Verbündete.</p><h4>E: Disrupt</h4><p>Stört Engages und kann BMs am Aufsteigen hindern.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Sehr stark gegen gegnerische Battlemounts. Du kannst verhindern, dass sie resetten. Dein Q Stun kann Engages canceln.</p>`,
    'Juggernaut': `<h4>Fähigkeiten (Pull & Purge)</h4><p>Zieht Gegner (15m Radius) zusammen und purged sie kontinuierlich. Benötigt mindestens 6 Charges. Eine Mischung aus Icicle, Camlann und Life Curse.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Wird in der Melee Bomb Squad genutzt, um Clumps zu erzeugen oder den Main-Zerg zu unterstützen. Der Pull kann gecleansed werden, aber es ist schwer, so viele Spieler gleichzeitig zu cleanen.</p>`,
    'Flame Basilisk': `<h4>Fähigkeiten (Healing Reduction & Pierce)</h4><p>Verursacht Healing Sickness (Heilungsreduktion) auf einem langen Cooldown und hat einen Pierce-Effekt auf einem kurzen Cooldown.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Sehr teuer. Wird genutzt, um die Heilung des Gegners zu unterdrücken (Healing Sickness) und die Rüstung zu durchdringen.</p>`,
    'Ancient Ent': `<h4>Fähigkeiten (Healing Boost)</h4><p>Gibt einen massiven Heilungsboost (ähnlich Rootbound Q, aber 40% Heilungsboost) und hat einen starken Disrupt. Fähigkeiten sind stationär.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Backline BM. Sehr gut in Castles oder Territories, da es dort oft enge Kämpfe gibt. Wird oft ignoriert, ist aber ein starker Heal-Support.</p>`,
    'Phalanx Beetle': `<h4>Q / W / E</h4><p><b>Q:</b> Schwach. <b>W:</b> Ähnlich einer Demon Armor, aber nur für dich selbst (kein AoE). <b>E:</b> Ähnlich einem schwachen Icicle.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Wird kaum gespielt, da es im Vergleich zu anderen BMs (wie Demon Armor) wenig Utility bietet.</p>`,
    'Goliath Horseeater': `<h4>Fähigkeiten</h4><p>Hat nur zwei Skills, die ähnlich wie Daybreaker funktionieren. Wurde nie wirklich reworked.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Wird im ZvZ kaum genutzt, da es bessere Optionen gibt.</p>`,
    'Battle Rhino': `<h4>Fähigkeiten</h4><p>Das erste BM im Spiel. Hat nur zwei Skills (einer ähnlich Daybreaker). Wurde seit langem nicht mehr angepasst.</p><p class="mut" style="margin-top:12px; font-size:0.9em;"><b>Taktik:</b> Wird heutzutage so gut wie gar nicht mehr im ZvZ gespielt.</p>`
};

basics:()=>`<h2>ZvZ-Basics</h2><p class=s>Grundlagen und Fundamente für ZvZ-Erfolg.</p>
<h3>Was ist ZvZ?</h3>
<div class=card><p style="margin:0"><b>ZvZ = Zerg versus Zerg</b>: große, chaotische Schlachten in der Open World.</p><p style="margin:8px 0 0">Es geht um <b>Objectives</b>: Outposts, Castles, Territories, Cores, Vortexes. Es gibt viele Gründe, warum Leute massen und kämpfen – oft einfach aus Spaß. ZvZ ist <b>Kernbestandteil der Gildenaktivitäten</b> in Albion und kann sehr lohnend sein, wenn man es richtig macht.</p></div>
<h3>Mindestvoraussetzungen</h3>
<p class=s>Drei Dinge, die man zwingend braucht:</p>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px">
<div class=card style="margin:0"><b>Gutes Gear und Economy</b><p class=mut style="margin:6px 0 0">ZvZ ist teuer. Die genauen Gear-Anforderungen (inkl. IP und Builds) findest du in unserer <a href="https://www.albionzvz.com/g/the-fallen/compositions/f730f3e1-87cb-4b2d-b1f8-b743cc887cf3" target="_blank" rel="noopener" style="text-decoration:underline">Albion ZvZ Composition</a>. Beachte zudem das Regear-System!</p></div>
<div class=card style="margin:0"><b>Kommunikation (Pflicht)</b><p class=mut style="margin:6px 0 0">Mikrofon + Voice-Software wie Discord oder TeamSpeak. Ohne Kommunikation mit dem Team geht es nicht.</p></div>
<div class=card style="margin:0"><b>Regelmäßig aktiv sein</b><p class=mut style="margin:6px 0 0">Wichtigster Punkt – noch wichtiger als Kommunikation. Bestes Gear hilft nichts ohne ein eingespieltes Team. Regelmäßiges trainieren bringt alle auf denselben Stand und baut Synergie auf.</p></div>
</div>
<h3>Allgemeine Tipps</h3>
${D('Positionierung (wichtigster Tipp)',`<ul><li>Immer die eigene Position relativ zu <b>Team und Gegner</b> im Blick behalten.</li><li><b>Nicht clustern</b>, Impact von Gegner-AoE minimieren.</li><li>Grund: Albion skaliert AoE-Schaden danach, <b>wie viele Spieler getroffen werden</b> → siehe <a href="#buffs" class="jump-to-buff" data-buff="buffs-aoe">AoE Escalation</a>.</li><li>Deshalb hört man im Voice ständig „Positioning!", „Spread out!" – man soll <b>gespreadet</b> stehen, damit eingehender Schaden nicht alles auf einmal zerlegt.</li><li>Zweiter wichtiger Punkt: Während der eingehende Schaden auf einen Punkt fliegt, sind die <b>Defensiven Fähigkeiten der Supports und D-Tanks</b> dafür verantwortlich, den Disengage vorzubereiten oder den eingehenden Engage der Gegner aufzuhalten. <b>Ohne gut genutzte Defensive Fähigkeiten bringt viel DMG nichts.</b></li></ul>`,0)}
${D('Allgemeiner Fokus im ZvZ',`<ul><li>High-Priority-Ziele fokussieren: <b>Healer und DPS</b>.</li><li>Grund: Fights enden oft, wenn eine Schlüsselrolle fällt.</li><li>Heiler tot → keine Sustain mehr → Gegner spreadet und rennt.</li><li>DPS tot → kein Schaden mehr → Gegner-Zerg kann nichts mehr töten → Gegner spreadet und geht.</li><li>Deshalb: Rolle und Positionierung ernst nehmen – wer gecatcht wird, kann den Fight fürs ganze Team verlieren.</li></ul>`)}
${D('Klare Kommunikation',`<ul><li>Der <b>Shotcaller</b> gibt die Richtung vor.</li><li>Comms müssen <b>klar und knapp</b> sein, und man muss tun, was der Caller sagt – sonst bricht die <b>Synergie des Zergs</b> und es wird unklar (<a href="#glossar">→ Call-Glossar</a>).</li></ul><p style="margin-top:12px;">Wir müssen folgendes von jedem Spieler erwarten, damit eine klare Kommunikation gewährleistet ist:</p>`)}
${D('Scouting-Informationen', `<p>Falls man Gegner im ZvZ-Event als Scout spottet, sind folgende Informationen essenziell (nicht weniger und nicht mehr):</p><ul><li><b>Name der Gilde/Allianz</b></li><li><b>Disarray</b> des gescouteten Spielers</li><li><b>IP</b> vom Spieler (bzw. wenn man mehrere Leute anklicken kann, den ungefähren Durchschnitt der IP des Zergs)</li><li><b>Playstyle</b> (wenn man sich auskennt: Clap Kite, Melee Clap, Full Brawl)</li></ul>`)}
${D('Albion Settings für ZvZ (Essenziell)', `<p>Diese Einstellungen sind im ZvZ überlebenswichtig und sollten vor jedem Content geprüft werden:</p><ul><li><b>Zaubereffekte (Spell Effects):</b> <b>NIEDRIG</b> oder <b>AUS</b>. Maximale FPS und bessere Sicht auf Boden-AoEs.</li><li><b>Kamera-Zoom:</b> <b>Maximal herauszoomen</b> (Mausrad nach unten). Mehr Übersicht über den Zerg und Flanken.</li><li><b>Smart Cast:</b> <b>Situativ / Meistens AUS</b>. Bei Boden-AoEs (Tanks, Longbow) mit sichtbarem Kreis zielen, um nicht ins Leere zu werfen.</li><li><b>Doppelklick zum Bewegen:</b> <b>AUSSCHALTEN</b>. Verhindert versehentliches Weglaufen.</li><li><b>Namen & Lebensbalken:</b> <b>HP-Balken AN, Namen AUS</b> (falls möglich). Weniger visuelles Chaos.</li><li><b>Party Member Marker Size:</b> <b>Big</b>. Besser sichtbar.</li><li><b>Party Member Marker:</b> <b>ON</b>.</li><li><b>Quick Hotkey:</b> <b>WICHTIG!</b> Stellt euch im Menü (ESC = Albion Settings = Bindings = Fast ganz unten = "Select Marked Target 5") diese Einstellung auf einen beliebigen Hotkey, um mit dem Hotkey Kronenmark Ziele auszuwählen (z.B. auf T für Main Tank).</li></ul>`)}
${D('Adaptabilität',`<ul><li>Strategie an den Verlauf des Fights anpassen, flexibel bleiben.</li><li>Beispiel: Als Main-DPS auch mal andere Rollen spielen, um ein Grundverständnis für jede Rolle zu bekommen. Wer alle Rollen versteht, wird ein <b>besserer Spieler</b> und ein <b>großer Gewinn für jede ZvZ-Gruppe</b>.</li></ul>`)}
<h3>Bewegung & Formation</h3>
${D('Flanks & Bewegung', `<p>Die Kunst eines jeden Zerg-Fights ist es, nicht als ein einziger großer Haufen (Blob) zu laufen. Teilt euch in <b>Flanks (zwei Hälften)</b> auf, bevor ihr auf den Gegner trefft. Wenn der Engage beginnt, bildet ihr aus diesen Flanks den <b>Kreis</b> (Zentrum und Außenseiten), um AoE-Schaden zu minimieren.</p><ul><li><b>Chasing (Verfolgen):</b> Ihr habt Momentum und lauft dem Gegner hinterher.</li><li><b>Kiting (Weglaufen):</b> Der Gegner hat Momentum. Ihr lauft weg, aber schießt weiter (Poke).</li><li><b>Soft Kiting (Gegen Brawl):</b> Haltet Abstand, aber rennt nicht panisch weg. Zeit gewinnen, um Cooldowns zu resetten, während ihr weiterhin Schaden macht.</li><li><b>Holding (Halten):</b> Ihr stoppt die Bewegung. Tanks blockieren den Gegner, DPS versuchen, ihn aus der Distanz zu töten.</li></ul>`, 0, 'border-left: 4px solid #5fd38a')}
<h3>Party-Größen</h3>
<p class=s>Die Größe der Party beeinflusst Taktik und Strategie.</p>
<div class=row id=ps>${PT.map((p,i)=>`<button class="b${i?'':' on'}" data-i=${i}>${p[0]}</button>`).join('')}</div>
<div class=card id=pd></div>
<p class=mut>Alle Größen funktionieren im Kern gleich – und in jeder Größe sind die Rollen entscheidend.</p>`,

comps:()=>`<h2>Comps</h2><p class=s>Unsere aktuelle Comp: Melee Clap. <a href="https://www.albionzvz.com/g/the-fallen/compositions/f730f3e1-87cb-4b2d-b1f8-b743cc887cf3" target="_blank" rel="noopener" style="text-decoration:underline">Zur AlbionZvZ-Composition</a>.</p><p class=s style="margin-top:-10px;margin-bottom:24px;">Hier findest du eine Erklärung zu unserem Spielstil. Bei Fragen oder Anmerkungen wende dich gerne an den Discord!</p>
<div id="cb">
    <h3 style="margin-top:20px;">Grundkonzept</h3>
    <div class=card style="margin-bottom:20px;"><p style="margin:0;">Unsere Comp ist eine <b>Melee Clap</b>. Wir spielen derzeit noch weniger mit dem Brawl/Flood Part, da unsere Comp durch die aktuelle Meta auf viele Longbows bzw. Demonfangs ausgelegt ist. Der Fokus liegt stark auf der Kreis-Mechanik (Positionierung) und dem kontrollierten Clap. Die Brawler zwingen den Gegner an den Außenseiten unter Druck, während unser Main-Engage (Party 1) im Zentrum die Lücken für die Kills ausnutzt.</p></div>
    <h3>Die Phasen des Fights</h3>
    ${D('Regeln & IP-Anforderungen', `<p>Der Caller gibt einen 5 Sekunden Countdown und oft eine Richtung (z.B. "Wall East") an. Defensives sollten eigenständig und situationsbedingt genutzt werden (siehe <a href="#weapons-bms">Waffen & BMs</a>). IP-Anforderungen: Tanks/Supports brauchen hohe IP auf der Brust (Plate), um den Engage zu überleben. Für DPS gilt unsere Gildenregel: Du brauchst <b>100 Specs auf deiner Waffe</b>.</p>`, 0, '', 'mc-regeln')}
    ${D('Positionierung (Der Kreis)', `<p style="margin-top:0">Stell dir den Fight als einen Kreis vor. Es gibt ein gefährliches Zentrum und sichere Außenseiten. Der Caller markiert oft das Zentrum mit einem Crown-Mark.</p><div style="display:flex; justify-content:center; margin:20px 0;"><svg viewBox="0 -20 200 240" style="width:100%; max-width:320px; display:block;"><circle cx="100" cy="100" r="80" fill="none" stroke="var(--ln)" stroke-width="2" stroke-dasharray="5,5" /><circle cx="100" cy="100" r="14" fill="#c4a1ff" opacity="0.4" /><circle cx="100" cy="100" r="10" fill="#c4a1ff" /><text x="100" y="85" text-anchor="middle" fill="var(--fg)" font-size="11" font-weight="bold">Caller</text><circle cx="70" cy="70" r="7" fill="#6cb2ff" stroke="var(--bg)" stroke-width="2" /><circle cx="130" cy="70" r="7" fill="#6cb2ff" stroke="var(--bg)" stroke-width="2" /><circle cx="70" cy="130" r="7" fill="#6cb2ff" stroke="var(--bg)" stroke-width="2" /><circle cx="130" cy="130" r="7" fill="#6cb2ff" stroke="var(--bg)" stroke-width="2" /><text x="100" y="55" text-anchor="middle" fill="var(--fg)" font-size="10">Tanks</text><circle cx="100" cy="20" r="7" fill="#ff6b6b" stroke="var(--bg)" stroke-width="2" /><circle cx="20" cy="100" r="7" fill="#ff6b6b" stroke="var(--bg)" stroke-width="2" /><text x="100" y="5" text-anchor="middle" fill="var(--fg)" font-size="10">Brawl/Clap DPS</text><circle cx="156" cy="44" r="7" fill="#ffa94d" stroke="var(--bg)" stroke-width="2" /><circle cx="156" cy="156" r="7" fill="#ffa94d" stroke="var(--bg)" stroke-width="2" /><text x="170" y="35" text-anchor="middle" fill="var(--fg)" font-size="10">Support</text><text x="170" y="175" text-anchor="middle" fill="var(--fg)" font-size="10">Support</text><circle cx="44" cy="44" r="7" fill="#5fd38a" stroke="var(--bg)" stroke-width="2" /><circle cx="180" cy="100" r="7" fill="#5fd38a" stroke="var(--bg)" stroke-width="2" /><circle cx="44" cy="156" r="7" fill="#5fd38a" stroke="var(--bg)" stroke-width="2" /><text x="30" y="35" text-anchor="middle" fill="var(--fg)" font-size="10">Heiler</text><text x="30" y="175" text-anchor="middle" fill="var(--fg)" font-size="10">Heiler</text><circle cx="100" cy="180" r="7" fill="#ff6b6b" stroke="var(--bg)" stroke-width="2" /></svg></div><ul style="margin-top:16px;"><li><b>Das Zentrum:</b> Hier steht der Caller. Tanks stehen hier nur, wenn sie volles Leben haben. Wer hier steht, wird von AoE-Clumps bestraft.</li><li><b>Die Seiten (Sides):</b> Heiler und Ranged DPS stehen außen. Sie haben Übersicht, sind sicher vor CC und können in Ruhe arbeiten. Tanks bewegen sich nur dann nach außen zu den Heilern, wenn sie <b>low sind, dringend Hilfe benötigen oder die Heiler selbst Hilfe brauchen</b> (z.B. um sie zu peelen), um die Positionierung nicht zu brechen.</li><li><b>Die Supports:</b> Positionieren sich nah am Caller oder in den Flanks, um ihre Buffs und Debuffs (wie Demon Armor oder Locus) zum richtigen Zeitpunkt setzen zu können und den Engage zu unterstützen.</li><li><b>Die Tanks:</b> Unterstützen den Clump, verteidigen gegen den Engage der Gegner und fungieren als Bindeglied zwischen innen und außen. Sie stören dort, wo Hilfe benötigt wird.</li><li><b>Clumpt nicht!</b> <i>"Safety is not always where no enemies are."</i> Sicherheit ist dort, wo eure Verbündeten <b>nicht</b> stehen, aber nah genug an den Heilern.</li></ul>`, 0, 'border-left: 4px solid var(--mut)', 'mc-kreis')}
    ${D('Main Engage (Der Clap)', `<div style="margin-bottom:16px;"><p>Der Caller sucht Lücken, wenn Gegner out of position sind. Er zwingt den Gegner, seine Defensives (wie Demon Armor, Locus) zu verbrennen. Orientiert euch an der Kreis-Mechanik: Das Hauptziel ist es, viele Gegner im Zentrum zu clumpen, damit die AOE-Escalation unserer Range-DPS (Longbows/Demonfangs) zuschlägt. Die Range-DPS stehen dabei sicher an den Außenseiten des Kreises. Wichtig ist der <b>5-Sekunden-Countdown</b>, den der Caller vor dem Engage gibt (genaue Aufschlüsselung siehe unten). (Beispiele für Engage: Offensive Great Arcane, Golem). Genauere Timings für die jeweiligen Waffen findest du unter <a href="#weapons-bms" style="text-decoration:underline">Waffen & BMs</a>.</p><div style="display:flex; flex-direction:column; gap:8px; margin-top:16px;"><div style="display:flex; gap:12px; align-items:flex-start; background:var(--hv); padding:12px; border-radius:var(--r-sm); border-left:3px solid #6cb2ff;"><b style="min-width:70px; font-size:0.9em; color:#6cb2ff; margin-top:2px;">5 Sekunden</b><span style="font-size:0.95em;"><b>Tanks:</b> Gehen in Position. (Boots nur situativ zünden, wenn nötig; Boots of Valor für den Clump aufheben).<br><b>DPS:</b> Beginnen, Flanks zu bilden.</span></div><div style="display:flex; gap:12px; align-items:flex-start; background:var(--hv); padding:12px; border-radius:var(--r-sm); border-left:3px solid #ffa94d;"><b style="min-width:70px; font-size:0.9em; color:#ffa94d; margin-top:2px;">4 Sekunden</b><span style="font-size:0.95em;"><b>Setup Tanks:</b> Bereiten in der vom Caller gecallten Richtung ein Setup vor (z.B. GA).<br><b>Offensive Tanks:</b> Stören die Defensiv-Rollen der Gegner (Chaos stiften).</span></div><div style="display:flex; gap:12px; align-items:flex-start; background:var(--hv); padding:12px; border-radius:var(--r-sm); border-left:3px solid #ff6b6b;"><b style="min-width:70px; font-size:0.9em; color:#ff6b6b; margin-top:2px;">3 Sekunden</b><span style="font-size:0.95em;"><b>DPS:</b> Wer auf <b>Boots of Valor</b> (oder Clump-Boots) spielt, zündet diese JETZT, um nicht gestunned/gerootet zu werden und den Clump sicher zu erreichen. Alle anderen nutzen ihre Boots <i>situativ</i> (z.B. für Disengage).</span></div><div style="display:flex; gap:12px; align-items:flex-start; background:var(--hv); padding:12px; border-radius:var(--r-sm); border-left:3px solid #5fd38a;"><b style="min-width:70px; font-size:0.9em; color:#5fd38a; margin-top:2px;">2 Sekunden</b><span style="font-size:0.95em;"><b>Supports:</b> Setzen Debuffs / Pierces.<br><b>Tanks:</b> Weitere Pulls ziehen Gegner zusammen.</span></div><div style="display:flex; gap:12px; align-items:flex-start; background:var(--hv); padding:12px; border-radius:var(--r-sm); border-left:3px solid #c4a1ff;"><b style="min-width:70px; font-size:0.9em; color:#c4a1ff; margin-top:2px;">1 Sekunde</b><span style="font-size:0.95em;"><b>DPS:</b> Der Clap trifft (Schaden kommt).<br><b>Tanks:</b> Halten den Clump.<br><b>Defensive Rollen:</b> Bereiten sich auf den Counter-Engage der Gegner vor.<br><b>Melee Brawler:</b> Bereiten Off-Clap Druck am Kreisrand auf Heiler/DPS vor.</span></div><div style="display:flex; gap:12px; align-items:flex-start; background:var(--hv); padding:12px; border-radius:var(--r-sm); border-left:3px solid #9ca3af;"><b style="min-width:70px; font-size:0.9em; color:#9ca3af; margin-top:2px;">Heiler</b><span style="font-size:0.95em;">Positionieren sich außen am Rand (Backline) und sind bereit zum Heilen.</span></div></div></div>`, 0, '', 'mc-engage')}
    ${D('Brawl Druck', `<p>Die Melee DPS (oft Leder) bewegen sich entlang der Außenseiten (Sides) des Kreises. Sie setzen massiven Druck durch <b>DoTs (Damage over Time / Schaden über Zeit)</b> und <b>Healing Reduction (Heilungsreduzierung)</b> auf die Gegner an den Seiten, um diese ins Zentrum zu zwingen, wo unser Clap sie erledigt.</p>`, 0, '', 'mc-brawl')}
    ${D('Bait & Switch (Caller-Taktik)', `<p>Fake Engage: Der Caller tut so, als würde er engagen, um die Defensives des Gegners (wie Demon Armor) zu ziehen. Sobald diese auf Cooldown sind, folgt der echte, tödliche Engage.</p>`, 0, '', 'mc-bait')}
    ${D('Flood (Caller-Taktik)', `<p>Eine extrem aggressive Welle. Die gesamte Melee Clap flutet in den Gegner. Wichtig: Nutzt eure Mobilität (Boots), um schnell an der gegnerischen Frontline vorbei in die Backline zu kommen. Wir setzen hierbei auf unsere schnellen DPS-Setups (Demonfang/Longbow) für den Burst.</p>`, 0, '', 'mc-tsunami')}
    <h3 style="margin-top:40px;">Welchem Prinzip gehen wir gegen die verschiedenen Comps nach?</h3>
    <p class="mut" style="margin-bottom:16px;">Wenn ihr gegen bestimmte Comps spielt, sind diese Verhaltensweisen entscheidend.</p>
    ${D('Allgemeine Konter-Taktik (Prävention & Überleben)', `<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;"><div class="card" style="margin:0; border-left: 4px solid #5fd38a;"><b style="color:#5fd38a;">1. Prävention (Vor dem Engage)</b><p class="mut" style="font-size:0.9rem; margin-top:8px; margin-bottom:0;">Spreaden, nicht im Zentrum stapeln. Deftanks/Supports auf gegnerisches Movement achten.</p></div><div class="card" style="margin:0; border-left: 4px solid #6cb2ff;"><b style="color:#6cb2ff;">2. Überleben (Während des Engages)</b><p class="mut" style="font-size:0.9rem; margin-top:8px; margin-bottom:0;">Sofort Defensives zünden, CC cleansen, auf CC-Resistance achten.</p></div><div class="card" style="margin:0; border-left: 4px solid #ffa94d;"><b style="color:#ffa94d;">3. Bestrafen (Nach dem Engage)</b><p class="mut" style="font-size:0.9rem; margin-top:8px; margin-bottom:0;">Cooldown-Fenster für Counter-Engage nutzen. Brawl-Comps gewinnen den Sustain-Kampf danach.</p></div></div>`)}
    ${D('Gegen Mirror Matchup (Melee Clap)', `<p><b>Die Win-Condition:</b> Wer die Seiten (Sides) des Kreises kontrolliert, gewinnt.</p><p><b>Verhalten:</b> Ihr müsst euch extrem spreaden. Wenn der Gegner engagt, dürfen sie maximal 1-2 Leute von euch killen, wenn ihr richtig steht.</p><p>Eure Off-Timer machen konstanten Druck und ziehen Defensives, während die reine Melee Clap nur den kurzen Moment des Engages hat.</p>`)}
    ${D('Gegen Clap Kite', `<p><b>Verhalten:</b> Das Matchup ist anspruchsvoller als es aussieht. Es erfordert Disziplin bei der Positionierung und darf nicht als "einfach" abgetan werden.</p><p><b>Taktik:</b> Spielt an den Seiten, lasst euch nicht auf einen sinnlosen Chase ein. Wenn sie engagen, killen sie nur sehr wenige Leute. Danach brawlt ihr einfach die Seiten und holt euch den Druck zurück.</p><p><b>Wichtig (Eigenständiges Handeln):</b> Unsere Tanks müssen hier selbstständig agieren, da der Caller nicht alles frühzeitig sehen kann. Wenn eine Kite-Situation eintritt, müssen Def- und Offensive Tanks sofort aufmounten und dem gegnerischen Zerg den Weg zu Chokes abschneiden. Lasst euch nicht abschießen, sondern zwingt sie in einen direkten Kampf.</p>`)}
    ${D('Gegen Full Brawl', `<p><b>Realität:</b> Zergs, die Full Brawl spielen und gleich groß oder größer sind, sind sehr schwer zu schlagen.</p><p><b>Verhalten:</b> Oberste Regel: <b>Nicht stacken!</b> Spielt an den Seiten und sterbt nicht durch die Dauer-DoTs und den Flächenschaden des Brawls.</p>`)}
</div>`,

buffs:()=>`<h2>Buffs und Debuffs</h2><p class=s>Mechaniken, die jeden Fight bestimmen. Werte aus Community-Quellen, nach Patches prüfen.</p>
<div class="warn-box" style="margin-bottom:24px;"><b>Wichtiger Zusatzpunkt (Dragonfire Patch)</b> Seit Patch 32.000.1 (31. August 2026) ist die Resilience auf 0 gesetzt worden. Trotzdem dominiert Melee Clap aktuell weiterhin bzw. eine Rückänderung wird erwartet. <a href="https://albiononline.com/news" target="_blank" rel="noopener" style="text-decoration:underline">Zu den offiziellen Patchnotes</a>.</div>
${D('Diminishing Returns', `<p>Wiederholtes CC (Crowd Control) auf dasselbe Ziel wird kürzer. Stuns, Silences, Roots und erzwungene Bewegung zählen getrennt. Cleanse setzt die DR dieser Kategorie zurück.</p><p class="mut" style="font-size:0.9em; margin-bottom:12px;">Jedes weitere CC auf ein Ziel reduziert die Dauer um ca. 20%. <b>Roots sind für das Setup gut, andere Stuns sind aufgrund der DR aber horrible (verschwendet).</b></p><div class=card style="margin-top:12px"><div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Anzahl aufeinanderfolgender CCs:</span><b><span id=dr-count>1</span></b></div><input type=range id=dr-slider min=1 max=5 value=1><div class="big" id=dr-val style="margin-top:12px">100% Dauer</div></div>`, 0, '', 'buffs-dr')}
${D('AoE Escalation',`AoE macht mehr Schaden, je mehr Ziele sie trifft: 8 % pro Ziel ab dem zweiten, maximal 56 % bei 8 Zielen.<div class=card><input type=range id=ae min=1 max=10 value=4><div>Getroffene Spieler: <b id=an>4</b></div><div class=big id=av></div></div>`, 0, '', 'buffs-aoe')}
${D('Healing Sickness',`Mehrere Heiler auf demselben Ziel schwächen die Heilung für 8 Sekunden ab. Heilung lieber verteilen.<div class=card><input type=range id=hs min=1 max=15 value=4><div>Heiler: <b id=hn>4</b></div><div class=big id=hv></div></div>`)}
${D('Resilience', `<p>Greifen mehrere Gegner ein Ziel an, sinkt der Schaden des Ziels (ca. 14 % bei 2, 26 % bei 3 Angreifern). Resilience Penetration ignoriert einen Teil dieser Reduzierung.</p><div class=card style="margin-top:12px"><div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Anzahl Angreifer:</span><b><span id=res-count>3</span></b></div><input type=range id=res-slider min=1 max=30 value=3><div class="big" id=res-val style="margin-top:12px">-26% Schaden</div><p class="mut" style="font-size:0.85rem; margin-bottom:0;">(Maximal 75% ab 26 Angreifern)</p></div>`)}
${D('Pierce und Shred', `<p>In Albion Online bezeichnet <b>Pierce</b> das Verringern der Armor und/oder Magic Resistance eines Gegners. Durch diese temporäre Senkung der Verteidigungswerte wird die Schadensreduktion des Ziels reduziert. Das führt dazu, dass das betroffene Ziel deutlich mehr Schaden erleidet.</p><p>In Albion wird der verursachte Schaden anhand der Armor- und Magic Resistance-Werte des Gegners berechnet. <b>Shredding-Effekte</b> reduzieren diese Verteidigungswerte entweder:</p><ul><li>um einen festen Wert (z.B. "- reduziert Armor um 30").</li><li>oder um einen prozentualen Anteil (z.B. "- reduziert Resistances um 20%").</li></ul><p><b>Stacking:</b> Viele Shredding-Debuffs können mehrfach gestapelt werden. Beispielsweise kann eine Waffe pro Treffer einen Debuff anwenden, der die Verteidigung um 10% reduziert. Lässt sich dieser Effekt bis zu 3-mal stacken, ergibt sich insgesamt eine Reduzierung von 30%.</p><p><b>Diminishing Returns:</b> Es gibt einen maximalen Wert, um die die Resistance eines Spielers verringert werden kann. Dieser liegt bei <b>-60%</b>.</p><div class=card style="margin-top:16px;"><div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Anzahl Stacks:</span><b><span id=shred-stack>3</span></b></div><input type=range id=shred-slider min=1 max=6 value=3><div class=big id=shred-val style="margin-top:12px">-30% Resistance</div><p class=mut style="font-size:0.85rem; margin-bottom:0;">(Annahme: 10% Shred pro Stack. Maximaler Cap liegt bei 60%)</p></div>`)}`,

disarray:()=>`<h2>Disarray</h2><p class=s>Mechaniken, die große Zergs ausbremsen.</p>${D('Disarray-Rechner', `<div class=card style="margin-top:12px"><div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Eigene Zerg-Größe:</span><b><span id=pc-val>40</span> Spieler</b></div><input type=range id=pc min=21 max=200 value=40><div class=big id=pc-tier style="margin-top:12px">Disarray Stufe 15</div><p class=mut style="font-size:0.85rem; margin-bottom:0;">(Basierend auf den offiziellen Schwellenwerten: 21=Stufe 1, 46=Stufe 20, 119=Stufe 40, 445=Stufe 67)</p></div><hr style="border:0;border-top:var(--bw) solid var(--ln);margin:16px 0"><div class=card style="margin:0"><p style="margin-top:0">Angreifer <input class=n type=number id=da value=40 min=1 max=67> Ziel <input class=n type=number id=dt value=20 min=1 max=67></p><div class=big id=dr></div></div>`, 1)}
${D('Homesick','Entsteht beim Betreten der Outlands über eine Portal Town, wenn das Home in einem Outlands-Hideout oder Smuggler’s Den liegt. Erhöht den Disarray-Debuff um 20 %.')}
${D('Battlemounts', `<p>Battle Mounts sind dafür gedacht, mächtige Werkzeuge zu sein, die den Verlauf großer Kämpfe entscheiden können. Mit der Zeit wurde es jedoch immer üblicher, große Mengen an Battle Mounts einzusetzen, sodass sie in vielen ZvZs nahezu unverzichtbar wurden.</p><p>Um diesem Problem entgegenzuwirken, tragen Battle Mounts nun zusätzlich zum bestehenden Disarray-System bei. Jedes Battle Mount erhöht den Disarray-Wert seiner Gruppe, solange es sich in der Region befindet.</p><div style="max-height:200px; overflow-y:auto; border:var(--bw) solid var(--ln); border-radius:var(--r-sm); margin-bottom:16px;"><table style="width:100%; margin:0; font-size:0.9em;"><tr><th style="padding:6px 12px;">Battlemount</th><th style="padding:6px 12px;">Disarray Level</th></tr>${BM_DATA.map(b=>`<tr><td style="padding:6px 12px;">${b[0]}</td><td style="padding:6px 12px;">${b[1]}</td></tr>`).join('')}</table></div><p>Der Disarray-Beitrag der Battle Mounts wird zusammen mit der normalen Disarray-Berechnung berücksichtigt. Die Mechanik greift erst, wenn der gesamte Battle-Mount-Disarray-Wert einer Allianz mehr als 15 Punkte beträgt. Nur der Anteil über 15 Punkten wird zur bestehenden Disarray-Stufe der Allianz hinzugefügt.</p><div class="card" style="margin-top:16px;"><p style="margin-top:0">Klicke Mounts an, um sie zu markieren. Mehrfachklicks erhöhen die Anzahl.</p><div class="row bm-grid" id=bm>${BM_DATA.map((b,i)=>`<button class=b data-i=${i}>${b[0]}</button>`).join('')}</div><div style="display:flex; justify-content:space-between; align-items:center; border-top:var(--bw) solid var(--ln); padding-top:12px; margin-top:12px;"><div>Summe: <b id=bs>0</b> | Zusätzliche Punkte: <b id=bx>0</b></div><button class=b id=br>Zurücksetzen</button></div><div style="margin-top:16px; padding:12px; background:var(--hv); border-radius:var(--r-sm); border:var(--bw) solid var(--ln);"><div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>Basis-Disarray (Spieler):</span><b id="total-base">15</b></div><div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Battlemount Zusatz:</span><b id="total-bm-extra">0</b></div><div style="display:flex; justify-content:space-between; font-size:1.2em; border-top:var(--bw) solid var(--ln); padding-top:8px;"><span><b>Gesamtes Disarray:</b></span><b id="total-combined" style="color:#ff6b6b;">15</b></div></div></div>`)}
${D('Invisibility-Schrein','2 Minuten Stealth (nicht sichtbar, nicht angreifbar, keine Angriffe oder Fähigkeiten), danach ein Silence-Debuff. Ausloggen beendet den Stealth sofort und startet den Debuff.')}`,

rollen:()=>`<h2>Rollen</h2><p class=s>Hier findest du die Aufgabenverteilung in unserer Melee Clap Comp. Klicke auf eine Rolle, um mehr zu erfahren. <a href="https://www.albionzvz.com/g/the-fallen/compositions/f730f3e1-87cb-4b2d-b1f8-b743cc887cf3" target="_blank" rel="noopener" style="text-decoration:underline">Zur AlbionZvZ-Composition</a>.</p>
${D('Caller', `<p style="margin-top:0">Der Commander des Zergs. Er gibt die Richtung vor, bestimmt den Fokus und leitet den Engage (mit einem 5-Sekunden-Countdown) sowie den Disengage ein. Er spielt meistens eine Tank-Waffe, um von der Frontline aus zu führen. <b>Wichtig:</b> Diese haben meist ein <b>5-Sekunden-Zeitfenster</b>, welches das Engage-Timing vorgibt. Er muss stets den Überblick über die Cooldowns und Positionen behalten. Oft gibt es einen zweiten Caller, der im Falle des Todes einspringt, scoutet oder Fake-Engages leitet. <b>Wichtig:</b> Seine Calls sind das Gesetz im Fight – Diskussionen folgen erst danach.</p><p class="mut" style="font-size:0.9em; margin-bottom:0;">Beispiele: Golem, 1H Mace.</p>`, 0, 'border-left: 4px solid #c4a1ff')}
${D('Tanks (Offensive & Defensive)', `<p style="margin-top:0">Tanks zeichnen sich durch hohe HP, Widerstandskräfte und Crowd Control (CC) aus. Im Kreiskonzept agieren sie flexibel zwischen Zentrum und Außenseite.</p><h4>Clump Tanks</h4><p>Ihre Aufgabe ist es, <b>Gegner zu stunnen/rooten (zu "clumpen")</b>, sie im Zentrum festzuhalten und den Engage optimal vorzubereiten.<br><span class="mut" style="font-size:0.9em">Beispiele: 1H Mace (Golem Caller), 1H Hammer, Earthrune.</span></p><h4>Offensive Tanks (Setup Tanks)</h4><p>Leiten den Engage ein und stürmen tief in den Gegner, um Chaos zu stiften und Druck aufzubauen.<br><span class="mut" style="font-size:0.9em">Beispiele: 1H Hammer, Stillgaze, evtl. Great Arcane.</span></p><h4>Defensive Tanks (Deftanks)</h4><p>Stoppen gegnerische Engages und peelen die eigene Backline durch CC.<br><span class="mut" style="font-size:0.9em">Beispiele: 1H Arcane, Icicle, Dreadstorm, Staff of Balance, 1H Mace Control, HeavyMace.</span></p>`, 0, 'border-left: 4px solid #6cb2ff')}
${D('Supports (Offensive & Defensive)', `<p style="margin-top:0">Supports buffen Verbündete, debuffen Gegner und reinigen CC (Cleanse). Sie halten sich meist nahe beim Caller oder in den Flanks auf.</p><h4>Offensive & DPS-Supports</h4><p>Ermöglichen einen effizienteren Engage, reduzieren gegnerische Rüstungen (Pierce/Shred) und buffen die Gruppe.<br><span class="mut" style="font-size:0.9em">Beispiele: Carving, Damnation, Realmbreaker, Incubus.</span></p><h4>Defensive Supports</h4><p>Fokussieren sich darauf, Schaden abzufangen oder zu vermeiden und die Gruppe am Leben zu halten.<br><span class="mut" style="font-size:0.9em">Beispiele: Demon Armor, Locus, Rootbound, Oathkeepers.</span></p>`, 0, 'border-left: 4px solid #ffa94d')}
${D('DPS (Melee & Ranged)', `<p style="margin-top:0">Man gewinnt Melee Fights in dem man die Seiten des Fights kontrolliert. So kann man den gegnerischen Zerg entweder auseinander drücken oder langsam komprimieren. Wenn sie auseinander gedrückt werden gewinnen wir. Wenn sie clumpen töten wir.</p><h4>Clap/Ranged DPS (Party1)</h4><p>Stehen in der <b>Backline (außen am Rand des Kreises)</b>. Sie warten auf den Clump der Tanks und feuern dann ihre geballte AOE-Eskalation ab.<br><span class="mut" style="font-size:0.9em">Beispiele: Spiked Gauntlets, Longbow, Demonfang, Dawnsong, Permafrost.</span></p><h4>Melee DPS (Brawler)</h4><p>Stehen in der Frontline. Sie fluten die gegnerische Backline, setzen DoTs und Healing Reduction ein, um massiven Druck aufzubauen.<br><span class="mut" style="font-size:0.9em">Beispiele: Galas (Galatine Pair), Ursine Maulers.</span></p>`, 0, 'border-left: 4px solid #ff6b6b')}
${D('Healer', `<p style="margin-top:0">Die Lebensadern des Zergs. Sie stehen in der <b>Backline (außen am Rand des Kreises)</b> und müssen ihre eigene Position stets im Auge behalten ("Du musst am Leben bleiben, um zu heilen").</p><p>Nature-Heiler sind oft für den Top-Up (HoTs) zuständig, Holy-Heiler für den Burst-Heal (Instant Heals).<br><span class="mut" style="font-size:0.9em">Beispiele: Tank Hallowfall, Exalted, 1H Nature, 1H Holy.</span></p>`, 0, 'border-left: 4px solid #5fd38a')}
${D('Battlemounts', `<p style="margin-top:0">Battlemounts (BMs) sind mächtige Reittiere, die den Kampf verändern können.</p><p><b>Wichtig:</b> Nicht jedes BM erhöht sofort das Disarray der eigenen Gruppe. Der Disarray-Beitrag greift erst, wenn der gesamte BM-Wert der Allianz 15 Punkte übersteigt. Weitere Details zu den Auswirkungen findest du auf unserer <a href="#disarray" style="text-decoration:underline">Disarray-Seite</a>.<br><span class="mut" style="font-size:0.9rem">Beispiele: Venom, Chariot.</span></p><p class="mut" style="margin-bottom:0; font-size:0.9rem;">Hinweis: Eine detaillierte Aufschlüsselung der einzelnen Battlemounts und Waffen folgt in Kürze auf einer neuen, separaten Seite.</p>`, 0, 'border-left: 4px solid #9ca3af')}
<div style="margin-top: 40px; border-top: var(--bw) solid var(--ln); padding-top: 20px;"><h3 style="margin-bottom:12px;">Weiterlesen</h3><p class="mut" style="margin-bottom:16px;">Möchtest du mehr über die Mechaniken, die Calls oder deine spezifische Waffe erfahren?</p><div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px;"><a href="#buffs" class="card" style="text-align:center; padding:20px;"><b>Buffs & Debuffs</b><div class="mut" style="font-size:0.85rem; margin-top:4px;">Mechaniken verstehen</div></a><a href="#glossar" class="card" style="text-align:center; padding:20px;"><b>Call-Glossar</b><div class="mut" style="font-size:0.85rem; margin-top:4px;">Calls nachschlagen</div></a><a href="#weapons-bms" class="card" style="text-align:center; padding:20px;"><b>Waffen & BMs</b><div class="mut" style="font-size:0.85rem; margin-top:4px;">Dein Build & Items</div></a></div></div>`,

'weapons-bms':()=>`<h2>Waffen & Battlemounts</h2>
<div id="weapon-content"></div>
<h2 style="margin-top:60px;">Battlemounts</h2>
<div class="card" style="margin-bottom:20px; border-left: 4px solid #9ca3af;">
    <p><b>Allgemeine Informationen:</b> Battlemounts übernehmen viele zentrale Supportrollen innerhalb des Zergs. Aufgrund der hohen HP haben können sie sich auch gut im Gegner/Engage überleben. Je nach Mount ist man innerhalb des Zergs für Mana/Cooldowns/Pierce/Interrupt/CC oder sogar Damage gegenüber anderen BMs zuständig. Ein Battlemount hat aber auch eine Einschüchternde Rolle gegenüber dem Gegner.</p>
    <p><b>Wichtig:</b> Grundsätzliche werden BMs in 3 Kategorien Überkategorien unterteilt, die ihre "Hauptaufgabe" darstellen, jedoch haben viele auch mehrere Aufgaben (Bsp: Battle Eagle's Q verkürzt Cooldowns).</p>
</div>
<div id="bms-container">
${Object.entries(BM_CATS).map(([cat, data], index) => `
    <div style="margin-bottom: 30px;">
        <h3 class="cat-${data.color}" style="margin-bottom: 4px;">${cat}</h3>
        <p class="mut" style="font-size: 0.9em; margin-bottom: 12px; margin-left: -14px; padding-left: 14px; border-left: 4px solid transparent;">${data.desc}</p>
        <div class=row style="margin-bottom: 0;">
            ${data.items.map(w=>`<button class="b btn-${data.color}" data-bm="${w}" data-target="bm-desc-${index}">${w}</button>`).join('')}
        </div>
        <div id="bm-desc-${index}" style="display:none; margin-top:12px;"></div>
    </div>
`).join('')}
</div>
<div class="card" style="text-align:center; margin-top:60px; padding:40px 20px;">
    <h3 style="margin-top:0;">Alle Sets & Builds auf Albion ZvZ</h3>
    <p class="mut" style="margin-bottom:20px;">Hier geht es direkt zu unserer Composition und den aktuellen Builds.</p>
    <a href="https://www.albionzvz.com/g/the-fallen/compositions/f730f3e1-87cb-4b2d-b1f8-b743cc887cf3" target="_blank" rel="noopener" class="b" style="display:inline-block; padding:10px 20px; text-decoration:none;">Zu den Sets auf AlbionZvZ</a>
</div>`,

<div class=grid>
    <a href="#buffs"><b>Buffs und Debuffs</b><span>Mechaniken und Rechner</span></a>
