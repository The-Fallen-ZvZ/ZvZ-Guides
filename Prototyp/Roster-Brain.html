<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster-Brain · The-Fallen</title>
<style>
:root{--bg:#000;--fg:#f5f5f5;--mut:#8c8c8c;--ln:#262626;--cd:#1a1a1a;--hv:#2a2a2a;color-scheme:dark;
--r-sm:8px;--r-md:12px;--accent:#c4a1ff;--ok:#5fd38a;--warn:#ffa94d;--bad:#ff6b6b;
--tank:#6cb2ff;--supp:#ffa94d;--sdps:#b07d5a;--dd:#ff6b6b;--heal:#5fd38a;--bm:#9ca3af;--call:#c4a1ff}
:root[data-theme=light]{--bg:#fff;--fg:#0a0a0a;--mut:#666;--ln:#e3e3e3;--cd:#f6f6f6;--hv:#ececec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:0.9375rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--ln)}
header b{letter-spacing:-.02em;white-space:nowrap}
header .sp{flex:1}
h1{font-size:1.05rem;margin:0;letter-spacing:-.02em}
.tag{color:var(--mut);font-size:.78rem;border:1px solid var(--ln);border-radius:20px;padding:1px 9px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.b{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:7px 14px;min-height:36px;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit}
.b:hover{background:var(--hv);border-color:var(--mut)}
.b.on{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.b.primary{border-color:var(--accent);color:var(--accent)}
.b.primary:hover{background:var(--accent);color:#000}
.b.small{padding:4px 9px;min-height:28px;font-size:.8rem}
.b.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.b.ghost:hover{color:var(--fg);background:var(--hv)}
.mut{color:var(--mut)}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;max-width:1620px;margin:0 auto;padding:14px}
.panel{border:1px solid var(--ln);border-radius:var(--r-md);background:var(--cd);min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 92px)}
.panel>h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0;
padding:12px 14px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;font-weight:600}
.panel>h2 .count{margin-left:auto;color:var(--fg);background:var(--hv);border-radius:20px;padding:0 8px;font-size:.75rem}
.panel .body{overflow:auto;padding:10px 12px;flex:1}
.panel .foot{border-top:1px solid var(--ln);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:1300px){
 .wrap{grid-template-columns:1fr}
 .panel{max-height:none}
 [data-side="players"]{order:2}[data-side="comp"]{order:1}[data-side="brain"]{order:3}
}

/* ---------- Signups ---------- */
.pcard{border:1px solid var(--ln);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:8px;background:var(--bg);
transition:border-color .15s,background .15s;cursor:grab}
.pcard:hover{border-color:var(--mut)}
.pcard.drag{opacity:.4}
.pcard.tent{border-style:dashed}
.pcard .top{display:flex;align-items:center;gap:6px}
.pcard .nm{font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .seat{margin-left:auto;font-size:.7rem;color:var(--ok);border:1px solid var(--ok);border-radius:20px;padding:0 6px;white-space:nowrap}
.pcard .seat.bench{color:var(--warn);border-color:var(--warn)}
.pcard .prefs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.wchip{font-size:.7rem;line-height:1.5;border-radius:4px;padding:1px 5px;background:var(--hv);border-left:2px solid var(--mut);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wchip .n{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:0 5px;margin-left:4px;font-size:.64rem;color:var(--fg);line-height:1.4}
.vision{font-size:.7rem;color:var(--mut);margin-top:4px}

/* ---------- Comp ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln)}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mut);padding:8px 12px;border-bottom:1px solid var(--ln);background:var(--bg)}
.stat b{color:var(--fg);font-size:.9rem}
.parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:10px;padding:12px}
.party{border:1px solid var(--ln);border-radius:var(--r-sm);background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.party.reserve{background:linear-gradient(180deg,rgba(156,163,175,.05),transparent)}
.party h3{margin:0;font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--ln);color:var(--mut);font-weight:600}
.party h3 .head{display:flex;align-items:center;gap:6px}
.party h3 .fill{margin-left:auto;font-size:.72rem;color:var(--fg)}
.party h3 .rcs{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}
.rc{display:inline-flex;align-items:center;gap:3px;font-size:.66rem;color:var(--mut)}
.rc i{width:7px;height:7px;border-radius:50%;display:inline-block}
.slots{padding:6px;overflow:auto;max-height:none}
.slot{display:flex;align-items:center;gap:7px;padding:5px 7px;border:1px solid transparent;border-left:3px solid var(--mut);
border-radius:6px;min-height:40px;margin-bottom:3px;background:var(--cd);cursor:pointer;transition:background .12s,border-color .12s}
.slot:hover{background:var(--hv)}
.slot.empty{border-style:dashed;border-left-width:3px;color:var(--mut);cursor:default;background:transparent}
.slot.empty .who{font-weight:400;font-size:.78rem}
.slot.over{outline:2px dashed var(--accent);outline-offset:1px}
.slot .weap{font-size:.7rem;color:var(--mut);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .who{font-size:.84rem;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .who .pw{font-weight:400;color:var(--mut);font-size:.74rem}
.slot .meta{margin-left:auto;font-size:.66rem;color:var(--mut);text-align:right;white-space:nowrap}
.slot .x{opacity:0;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:.9rem;padding:0 2px}
.slot:hover .x{opacity:1}
.slot .x:hover{color:var(--bad)}
.slot.caller{background:linear-gradient(90deg,rgba(196,161,255,.12),var(--cd))}

/* ---------- Brain ---------- */
.logitem{border-left:3px solid var(--ln);padding:6px 0 6px 9px;margin-bottom:8px;font-size:.82rem;line-height:1.45}
.logitem b{font-weight:600}
.logitem.ok{border-color:var(--ok)}
.logitem.warn{border-color:var(--warn)}
.logitem.bad{border-color:var(--bad)}
.logitem.info{border-color:var(--accent)}
.logsec{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 8px}
.logsec:first-child{margin-top:0}
.empty-note{color:var(--mut);font-size:.83rem;padding:6px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--hv);
border:1px solid var(--ln);border-radius:20px;padding:8px 16px;font-size:.85rem;opacity:0;pointer-events:none;
transition:all .25s;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--mut)}
.live .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(95,211,138,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,138,.5)}70%{box-shadow:0 0 0 7px rgba(95,211,138,0)}100%{box-shadow:0 0 0 0 rgba(95,211,138,0)}}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--ln);border-radius:var(--r-md);max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 6px;font-size:1.05rem}
textarea{width:100%;background:var(--cd);border:1px solid var(--ln);border-radius:8px;color:var(--fg);padding:10px;font:inherit;font-size:.85rem;resize:vertical}
select{background:var(--cd);border:1px solid var(--ln);border-radius:8px;color:var(--fg);padding:6px 8px;font:inherit;font-size:.85rem}
.picker{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--cd)}
.pick:hover{border-color:var(--accent)}
.pick .sc{margin-left:auto;font-size:.78rem;color:var(--mut)}
code{background:var(--hv);border-radius:4px;padding:1px 5px;font-size:.85em}
@media print{header,.panel[data-side="players"],.panel[data-side="brain"],.toolbar{display:none}}
</style>
</head>
<body>

<header>
  <h1>Roster-Brain <span class="tag">Prototyp</span></h1>
  <span class="live" id="live"><span class="pulse"></span><span id="live-txt">Tab-Sync aktiv</span></span>
  <span class="seg" style="display:inline-flex;gap:4px;margin-left:4px">
    <button class="b small" id="ds-test" onclick="loadDataset('test')">Test-Event</button>
    <button class="b small" id="ds-demo" onclick="loadDataset('demo')">Demo</button>
  </span>
  <button class="b small" id="live-btn" onclick="toggleLive()" title="Neue Anmeldungen über den Worker-Proxy abholen">Live: aus</button>
  <span class="sp"></span>
  <button class="b small" onclick="openSecondTab()">2. Tab öffnen</button>
  <button class="b small" onclick="openImport()">Signups einfügen</button>
  <button class="b small ghost" onclick="resetAll()">Zurücksetzen</button>
</header>

<div class="wrap">

  <!-- ================= SIGNUPS ================= -->
  <section class="panel" data-side="players">
    <h2>Angemeldet <span class="count" id="cnt-players">0</span></h2>
    <div class="body" id="players"></div>
    <div class="foot">
      <button class="b small" onclick="simulateSignup()">+ Anmeldung simulieren</button>
      <button class="b small ghost" onclick="clearSeats()">Sitze leeren</button>
    </div>
  </section>

  <!-- ================= COMP ================= -->
  <section class="panel" data-side="comp">
    <h2>Comp <span class="count" id="cnt-slots">0</span></h2>
    <div class="toolbar">
      <button class="b primary" onclick="buildGroup()">Build the Group</button>
      <button class="b small ghost" onclick="copyRoster()">Als Text kopieren</button>
      <button class="b small ghost" onclick="applyHistory()" title="Aktuelle Zuweisung als einen gespielten Einsatz zählen">Historie +1</button>
      <span class="sp" style="flex:1"></span>
      <span class="tag" id="built-at">noch nicht gebaut</span>
    </div>
    <div class="stat" id="stats"></div>
    <div class="parties" id="parties"></div>
  </section>

  <!-- ================= BRAIN ================= -->
  <section class="panel" data-side="brain">
    <h2>Gehirn <span class="count" id="cnt-bench" title="Spieler ohne Slot">0</span></h2>
    <div class="body" id="brain"></div>
    <div class="foot">
      <span class="mut" style="font-size:.75rem">Passung aus Wunschreihenfolge + Historie. Reserve-Slots (BMs, Offtimer) sind 25 % abgewertet. „Build the Group" ist ein Vorschlag.</span>
    </div>
  </section>

</div>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ENGINE (testbar, ohne DOM)
   ===================================================================== */
const ALIAS = {
  'Spiked':'Spiked Gauntlets','Perma':'Permafrost','Permafrost':'Permafrost',
  'Locus Defensive':'Locus','Locus Offensive':'Locus','Rootbound':'Rootbound MeleeClap',
  '1H Arcane (Tank)':'1H Arcane','1H Arcane (Support)':'1H Arcane',
  'Stillgaze (Setup)':'Stillgaze','Icicle':'Icicle (MeleeClap)',
  'Venom Basilisk':'Venom','Tower Chariot':'Chariot',
  'Hallowfall':'Tank Hallowfall','Great Arcane':'Great Arcane (Beam)',
  'Longbow (MeleeClap)':'Longbow','Demonfang (ANTIBRAWL)':'Demonfang'
};
function canon(w){
  const s = String(w||'').trim();
  return ALIAS[s] || s;
}

const ROLE_OF = {
  '1H Mace':'Tank','1H Hammer (Setup)':'Tank','Great Arcane (Beam)':'Tank','1H Arcane':'Tank',
  'Earthrune':'Tank','Dreadstorm':'Tank','Staff of Balance':'Tank','1H Mace Control':'Tank',
  'Stillgaze':'Tank','HeavyMace':'Tank','Icicle (MeleeClap)':'Tank',
  '1H Mace Support':'Support','Locus':'Support','Rootbound MeleeClap':'Support',
  'Oathkeepers':'Support','Grovekeeper':'Support',
  'Carving':'Support DPS','Damnation':'Support DPS','Shadowcaller':'Support DPS',
  'Incubus':'Support DPS','Realmbreaker':'Support DPS',
  'Spiked Gauntlets':'Clap DD','Longbow':'Clap DD','Demonfang':'Clap DD',
  'Permafrost':'Clap DD','Dawnsong':'Clap DD',
  'Galatine Pair (Offtimer)':'Brawl DD',
  'Exalted':'Healer','Exalted (Plate)':'Healer','Tank Hallowfall Royal':'Healer',
  'Tank Hallowfall':'Healer','1H Nature':'Healer','1H Holy':'Healer',
  'Venom':'Battlemount','Chariot':'Battlemount','Fill — Battlemount':'Battlemount',
  'Fill — Healer':'Healer',
  'Occult (Beam Spiked)':'Support','Occult (Cleanse)':'Support',
  'Heron (Kidnap)':'Tank','Hoj':'Tank','Infernal Staff':'Tank',
  'Lifecursed':'Clap DD','Riftglaive':'Clap DD'
};
const ROLE_COLOR = {'Tank':'#6cb2ff','Support':'#ffa94d','Support DPS':'#b07d5a','Clap DD':'#ff6b6b',
  'Brawl DD':'#ff6b6b','Healer':'#5fd38a','Battlemount':'#9ca3af','Caller':'#c4a1ff','Unbekannt':'#888'};
const PREF_W = [105,84,66,50,36,24];

const S = (w, caller)=>({weapons:Array.isArray(w)?w:[w], caller:!!caller, player:null, pick:null});
const DUAL = ()=>S(['Longbow','Demonfang']);
const EMPTY = ()=>S([]);

/* Comp-Stand 13.11.2026: 2 x 20 Haupt-Slots + Reservedatenbank */
const PARTY1 = [
  S('1H Mace', true),
  S('1H Hammer (Setup)'),
  S('Great Arcane (Beam)'),
  S('1H Arcane'),
  S('1H Mace Support'),
  S('Locus'),
  S('Carving'),
  S('Damnation'),
  S('Shadowcaller'),
  S('Incubus'),
  S('Realmbreaker'),
  S('Spiked Gauntlets'),
  DUAL(), DUAL(), DUAL(), DUAL(),
  S('Tank Hallowfall Royal'),
  S('Tank Hallowfall'),
  S('Tank Hallowfall'),
  S('Exalted')
];
const PARTY2 = [
  S('Earthrune'),
  S('Dreadstorm'),
  S('Staff of Balance'),
  S('1H Mace Control'),
  S('1H Mace Control'),
  S('Stillgaze'),
  S('Rootbound MeleeClap'),
  S('1H Mace Support'),
  S('Locus'),
  S('1H Arcane'),
  S('Permafrost'),
  S('Dawnsong'),
  DUAL(), DUAL(), DUAL(),
  S('Exalted (Plate)'),
  S('1H Nature'),
  S('Tank Hallowfall Royal'),
  S('Tank Hallowfall'),
  S('Tank Hallowfall')
];
const RESERVE = [
  S('Venom'), S('Chariot'), S('Fill — Battlemount'), S('Oathkeepers'),
  S('Icicle (MeleeClap)'), S('HeavyMace'), S('Grovekeeper'), S('1H Holy'),
  S('Galatine Pair (Offtimer)'), S('Galatine Pair (Offtimer)'), S('Galatine Pair (Offtimer)'),
  EMPTY(), EMPTY(), EMPTY(), EMPTY(), EMPTY(), EMPTY(), EMPTY(), EMPTY(), EMPTY()
];

const TEMPLATES = {
  'comp40': {label:'The-Fallen · 40 + Reserve', parties:[
    {name:'Party 1', tier:'main', slots:PARTY1},
    {name:'Party 2', tier:'main', slots:PARTY2},
    {name:'Alternative Rollen und BMs', tier:'reserve', slots:RESERVE}
  ]}
};

function roleOf(w){ return ROLE_OF[canon(w)] || 'Unbekannt'; }
function slotLabel(s){ return s.weapons.length ? s.weapons.join(' / ') : ''; }
function slotRole(s){ return s.weapons.length ? roleOf(s.weapons[0]) : 'Unbekannt'; }
function sumHist(p){ return Object.values(p.hist||{}).reduce((a,b)=>a+b,0); }
function familyHist(p,w){
  const r = roleOf(w);
  return Object.entries(p.hist||{}).filter(([k])=>roleOf(k)===r).reduce((a,[,v])=>a+v,0);
}
function topHist(p){
  const vals = Object.values(p.hist||{});
  return vals.length ? Math.max(...vals) : 0;
}

/**
 * Passung Spieler -> konkrete Waffe.
 * 1. Wunsch (exakt) > gleiche Rollenfamilie > Quereinstieg
 * 2. Historie auf der Waffe -> Rollenfamilie -> Anteil (Tie-Break)
 */
function scoreWeapon(p, w, callerSlot){
  const hist = p.hist || {};
  const prefs = (p.prefs||[]).map(canon);
  const idx = prefs.indexOf(canon(w));

  let base = 0;
  if(idx >= 0) base = PREF_W[Math.min(idx, PREF_W.length-1)];
  else {
    const r = roleOf(w);
    (p.prefs||[]).forEach((pw,i)=>{
      if(roleOf(pw) === r) base = Math.max(base, [48,38,28,20,14][Math.min(i,4)]);
    });
  }

  const hw = hist[canon(w)] || 0;
  const hc = familyHist(p, w);
  const total = sumHist(p);
  const share = total ? hw/total : 0;

  let s;
  if(base > 0){
    s = base
      + Math.min(hw,12)*2.4
      + Math.min(hc,25)*0.8
      + share*26
      + (total>0 && hw>0 && hw===topHist(p) ? 8 : 0);
  } else {
    s = (Math.min(hw,12)*2.4 + Math.min(hc,25)*0.8 + share*26) * 0.45;
  }

  if(p.tentative) s -= 22;
  if(callerSlot) s += p.caller ? 45 : -25;
  if(total === 0) s -= 5;
  return s;
}

/** Bester erlaubter Waffe des Slots fuer diesen Spieler. */
const NO_MATCH = -1e6;
function bestPick(p, slot){
  const ws = slot.weapons || [];
  if(!ws.length) return {score:NO_MATCH, pick:null};
  const prefs = (p.prefs||[]).map(canon);
  let best = NO_MATCH, pick = null;
  ws.forEach(w=>{
    let s = scoreWeapon(p, w, slot.caller);
    if(slot.tier === 'reserve'){
      const wants = prefs.includes(canon(w)) || ((p.hist||{})[canon(w)]||0) > 0;
      if(!wants) return;          // Reserve nur mit echtem Wunsch oder Erfahrung
      s *= 0.75;
    }
    if(s > best){ best = s; pick = w; }
  });
  if(pick === null) return {score:NO_MATCH, pick:null};
  return {score: Math.round(best*10)/10, pick};
}
function pairScore(p, slot){ return bestPick(p, slot).score; }

function reasonFor(p, slot, pick){
  const w = pick || (slot.weapons||[])[0];
  const prefs = (p.prefs||[]).map(canon);
  const idx = prefs.indexOf(canon(w));
  const hw = (p.hist||{})[canon(w)] || 0;
  const total = sumHist(p);
  let head;
  if(slot.caller && p.caller) head = 'Caller';
  else if(idx === 0) head = '1. Wahl';
  else if(idx > 0) head = (idx+1)+'. Wahl';
  else if(prefs.some(pw=>roleOf(pw)===roleOf(w))) head = 'gleiche Rolle';
  else head = 'Quereinstieg';
  const bits = [head];
  if(hw) bits.push(hw+'× gespielt');
  else if(total && familyHist(p,w)) bits.push(familyHist(p,w)+'× Rolle');
  else bits.push('neu auf der Rolle');
  if(p.tentative) bits.push('tentative');
  if(slot.caller && p.caller) bits.push('Caller');
  if(slot.tier === 'reserve') bits.push('Reserve');
  return {text: bits.join(' · '), head, hw, total};
}

/* Ungarische Methode (Minimierung) fuer n Zeilen <= m Spalten. */
function hungarian(cost){
  const n = cost.length, m = cost[0].length;
  const INF = 1e15;
  const u = new Array(n+1).fill(0), v = new Array(m+1).fill(0);
  const p = new Array(m+1).fill(0), way = new Array(m+1).fill(0);
  for(let i=1;i<=n;i++){
    p[0] = i;
    let j0 = 0;
    const minv = new Array(m+1).fill(INF);
    const used = new Array(m+1).fill(false);
    do{
      used[j0] = true;
      const i0 = p[j0];
      let delta = INF, j1 = 0;
      for(let j=1;j<=m;j++) if(!used[j]){
        const cur = cost[i0-1][j-1] - u[i0] - v[j];
        if(cur < minv[j]){ minv[j] = cur; way[j] = j0; }
        if(minv[j] < delta){ delta = minv[j]; j1 = j; }
      }
      for(let j=0;j<=m;j++){
        if(used[j]){ u[p[j]] += delta; v[j] -= delta; }
        else minv[j] -= delta;
      }
      j0 = j1;
    }while(p[j0] !== 0);
    do{ const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; }while(j0);
  }
  const rows = new Array(n).fill(null);
  for(let j=1;j<=m;j++) if(p[j] !== 0) rows[p[j]-1] = j-1;
  return rows;
}

/* Zuweisung innerhalb einer Stufe.
   Dummy-Spalten pro Slot: ein Slot darf leer bleiben, statt jemanden hineinzuzwingen. */
const THRESHOLD = {main:18, reserve:60};

function solveTier(players, entries){
  if(!entries.length || !players.length) return entries.map(()=>null);
  const picks = entries.map(e=>players.map(p=>bestPick(p, e.slot)));
  const score = picks.map(row=>row.map(x=>x.score));
  const cols = players.length + entries.length;
  const cost = score.map(row=>{
    const r = row.map(x=>-x);
    while(r.length < cols) r.push(0);
    return r;
  });
  const rows = hungarian(cost);
  return rows.map((pi, i)=>{
    if(pi === null || pi >= players.length) return null;
    if(score[i][pi] < THRESHOLD[entries[i].slot.tier] ) return null;
    return {player: players[pi], score: score[i][pi], pick: picks[i][pi].pick};
  });
}

/* Zweistufig: zuerst die Haupt-Comp, dann Reserve nur aus den Uebriggebliebenen.
   Der Caller ist gesetzt: er besetzt den Caller-Slot, bevor optimiert wird. */
function solveAssignment(players, slots){
  const out = slots.map(()=>null);
  if(!slots.length || !players.length) return out;

  let pool = players.slice();
  const cSlot = slots.findIndex(s=>s.caller);
  const cPlayer = pool.find(p=>p.caller);
  if(cSlot >= 0 && cPlayer){
    const bp = bestPick(cPlayer, slots[cSlot]);
    out[cSlot] = {player:cPlayer, score:bp.score, pick:bp.pick};
    pool = pool.filter(p=>p !== cPlayer);
  }

  const free = slots.map((s,i)=>i).filter(i=>out[i] === null);
  const mainIdx = free.filter(i=>slots[i].tier !== 'reserve');
  const resIdx  = free.filter(i=>slots[i].tier === 'reserve');

  const r1 = solveTier(pool, mainIdx.map(i=>({idx:i, slot:slots[i]})));
  mainIdx.forEach((idx,k)=>{ out[idx] = r1[k]; });

  const seated = new Set(r1.filter(Boolean).map(r=>r.player.name));
  const rest = pool.filter(p=>!seated.has(p.name));
  const r2 = solveTier(rest, resIdx.map(i=>({idx:i, slot:slots[i]})));
  resIdx.forEach((idx,k)=>{ out[idx] = r2[k]; });

  return out;
}

const LS = 'tf-roster-proto-v4';
const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('tf-roster') : null;
let state = null;
let lastBuilt = null;

function buildParties(tpl){
  return TEMPLATES[tpl].parties.map(p=>({
    name:p.name, tier:p.tier,
    slots:p.slots.map(s=>({weapons:[...s.weapons], caller:s.caller, player:null, pick:null}))
  }));
}
function freshState(tpl='comp40'){
  return {kind:'demo', tpl, parties:buildParties(tpl), players:demoPlayers(), builtAt:null, log:null};
}
/* Datenstand des echten Test-Events (albionzvz.com/e/75f6722e…) */
function stateFromTest(){
  return {
    kind:'test', tpl:'test',
    parties: TEST_EVENT.parties.map(p=>({
      name:p.name, tier:p.tier,
      slots:p.slots.map(s=>({
        weapons:[...s.weapons], caller:!!s.caller,
        player:s.player||null, pick:s.weapons[0]||null
      }))
    })),
    players: TEST_EVENT.players.map(p=>({
      name:p.name, caller:!!p.caller, prefs:[...p.prefs],
      hist:{}, tentative:!!p.tentative, note:p.note||''
    })),
    builtAt:null, log:null
  };
}
function loadDataset(kind){
  state = kind === 'test' ? stateFromTest() : freshState('comp40');
  lastBuilt = null;
  save();
  toast(kind === 'test'
    ? 'Test-Event geladen: ' + TEST_EVENT.players.length + ' Anmeldungen'
    : 'Demo geladen: ' + demoPlayers().length + ' Anmeldungen');
}
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.parties) || !Array.isArray(s.players)) return null;
    if(!s.kind) s.kind = 'demo';
    return s;
  }catch(e){ return null; }
}
function save(broadcast=true){
  localStorage.setItem(LS, JSON.stringify(state));
  render();
  if(broadcast && bc) bc.postMessage({type:'state', state:JSON.parse(JSON.stringify(state))});
}
if(bc) bc.onmessage = (e)=>{
  if(e && e.data && e.data.type === 'state'){
    state = e.data.state;
    render();
    toast('Update aus anderem Tab übernommen');
  }
};

const $ = s=>document.querySelector(s);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = $('#toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function findSlot(name){
  for(const pt of state.parties) for(const sl of pt.slots) if(sl.player === name) return sl;
  return null;
}
function flatSlots(){
  const out = [];
  state.parties.forEach((pt,pi)=>pt.slots.forEach((sl,si)=>out.push({
    pi, si, tier:pt.tier, weapons:sl.weapons, caller:sl.caller, player:sl.player, pick:sl.pick, ref:sl
  })));
  return out;
}
function activeSlots(){ return flatSlots().filter(s=>s.weapons.length); }

function render(){
  if(!state) state = stateFromTest();
  renderPlayers();
  renderComp();
  renderBrain();
  const dsT = $('#ds-test'), dsD = $('#ds-demo');
  if(dsT && dsD){
    dsT.classList.toggle('on', state.kind === 'test');
    dsD.classList.toggle('on', state.kind !== 'test');
  }
  $('#cnt-players').textContent = state.players.length;
  $('#cnt-slots').textContent = activeSlots().length + ' aktive Slots';
  $('#built-at').textContent = state.builtAt ? 'gebaut ' + new Date(state.builtAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : 'noch nicht gebaut';
}

function renderPlayers(){
  const el = $('#players');
  if(!state.players.length){ el.innerHTML = '<p class="empty-note">Noch keine Anmeldungen.</p>'; return; }
  el.innerHTML = state.players.map(p=>{
    const sl = findSlot(p.name);
    const built = !!state.builtAt || !!state.log;
    const seat = sl ? 'gesetzt' : (built ? 'Bank' : 'offen');
    const chips = (p.prefs||[]).map(w=>{
      const n = (p.hist||{})[canon(w)] || 0;
      return `<span class="wchip" style="border-left-color:${ROLE_COLOR[roleOf(w)]||'#888'}" title="${esc(roleOf(w))} · ${n} Einsätze">${esc(w)}${n?`<span class="n">${n}</span>`:''}</span>`;
    }).join('');
    const total = sumHist(p);
    return `<div class="pcard ${p.tentative?'tent':''}" draggable="true" data-name="${esc(p.name)}">
      <div class="top">
        <span class="nm">${esc(p.name)}</span>
        ${p.caller?'<span class="tag" style="border-color:'+ROLE_COLOR.Caller+';color:'+ROLE_COLOR.Caller+'">Caller</span>':''}
        <span class="seat ${(!sl && built)?'bench':''}">${seat}</span>
      </div>
      <div class="prefs">${chips}</div>
      <div class="vision">${total?`Historie: ${total} Einsätze`:'keine Historie'}</div>
    </div>`;
  }).join('');

  el.querySelectorAll('.pcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.name);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('drag');
    });
    card.addEventListener('dragend', ()=>card.classList.remove('drag'));
    card.addEventListener('dblclick', ()=>{ const sl=findSlot(card.dataset.name); if(sl){ sl.player=null; sl.pick=null; save(); } });
  });
}

function renderComp(){
  const wrap = $('#parties');
  wrap.innerHTML = state.parties.map((pt,pi)=>{
    const active = pt.slots.filter(s=>s.weapons.length);
    const filled = active.filter(s=>s.player).length;
    const counts = {};
    active.forEach(s=>{ const r = slotRole(s); counts[r] = (counts[r]||0)+1; });
    const rcs = Object.entries(counts).map(([r,n])=>
      `<span class="rc" title="${esc(r)}"><i style="background:${ROLE_COLOR[r]||'#888'}"></i>${n}</span>`).join('');

    return `<div class="party ${pt.tier==='reserve'?'reserve':''}">
      <h3>
        <div class="head">${esc(pt.name)}<span class="fill">${filled}/${active.length}</span></div>
        <div class="rcs">${rcs}</div>
      </h3>
      <div class="slots">${pt.slots.map((sl,si)=>{
        const c = sl.weapons.length ? (ROLE_COLOR[slotRole(sl)]||'#888') : 'var(--ln)';
        if(!sl.weapons.length){
          return `<div class="slot empty" style="border-left-color:${c}"><div style="min-width:0;flex:1">
            <div class="weap">Empty</div></div></div>`;
        }
        const empty = !sl.player;
        const reason = sl.player && lastBuilt
          ? reasonFor(state.players.find(p=>p.name===sl.player)||{prefs:[],hist:{}}, sl, sl.pick)
          : null;
        return `<div class="slot ${empty?'empty':''} ${sl.caller?'caller':''}" data-pi="${pi}" data-si="${si}"
          style="border-left-color:${c}" title="${esc(slotRole(sl))}">
          <div style="min-width:0;flex:1">
            <div class="weap">${esc(slotLabel(sl))}${sl.caller?' · Caller':''}</div>
            ${empty
              ? `<div class="who mut" style="font-weight:400;font-size:.8rem">frei</div>`
              : `<div class="who">${esc(sl.player)}${sl.pick && sl.weapons.length>1?` <span class="pw">${esc(sl.pick)}</span>`:''}</div>`}
          </div>
          ${empty?'':`<span class="meta">${esc((reason&&reason.head)||'')}</span><button class="x" title="Entfernen">×</button>`}
        </div>`;
      }).join('')}</div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.slot[data-pi]').forEach(slotEl=>{
    const pi = +slotEl.dataset.pi, si = +slotEl.dataset.si;
    slotEl.addEventListener('dragover', e=>{ e.preventDefault(); slotEl.classList.add('over'); });
    slotEl.addEventListener('dragleave', ()=>slotEl.classList.remove('over'));
    slotEl.addEventListener('drop', e=>{
      e.preventDefault(); slotEl.classList.remove('over');
      const name = e.dataTransfer.getData('text/plain');
      if(name) place(pi, si, name);
    });
    slotEl.addEventListener('click', e=>{
      if(e.target.closest('.x')) return;
      const sl = state.parties[pi].slots[si];
      if(!sl.player && sl.weapons.length) openPicker(pi, si);
    });
    const x = slotEl.querySelector('.x');
    if(x) x.addEventListener('click', e=>{ e.stopPropagation(); const sl=state.parties[pi].slots[si]; sl.player=null; sl.pick=null; save(); });
  });

  renderStats();
}

function renderStats(){
  const all = flatSlots();
  const main = all.filter(s=>s.tier==='main' && s.weapons.length);
  const res  = all.filter(s=>s.tier==='reserve' && s.weapons.length);
  const bench = state.players.filter(p=>!findSlot(p.name)).length;
  const openMain = main.filter(s=>!s.player).length;
  const openRes = res.filter(s=>!s.player).length;

  const healCheck = state.parties.filter(p=>p.tier==='main').map(pt=>{
    const heal = pt.slots.filter(s=>s.player && roleOf(s.pick||s.weapons[0])==='Healer').length;
    const tank = pt.slots.filter(s=>s.player && roleOf(s.pick||s.weapons[0])==='Tank').length;
    return {name:pt.name, heal, tank};
  });
  const notes = [];
  healCheck.forEach(h=>{
    if(state.builtAt && h.heal < 2) notes.push(`<span style="color:var(--warn)">${esc(h.name)}: nur ${h.heal} Heiler</span>`);
  });

  $('#stats').innerHTML = `
    <span><b>${main.filter(s=>s.player).length}</b>/${main.length} Haupt</span>
    <span><b>${res.filter(s=>s.player).length}</b>/${res.length} Reserve</span>
    <span><b>${openMain+openRes}</b> offen</span>
    <span><b>${bench}</b> Bank</span>
    <span><b>${state.players.length}</b> angemeldet</span>
    ${notes.join('')}`;
  $('#cnt-bench').textContent = bench;
}

function renderBrain(){
  const el = $('#brain');
  if(!state.log){
    const main = activeSlots().filter(s=>s.tier==='main').length;
    const res = activeSlots().filter(s=>s.tier==='reserve').length;
    el.innerHTML = `<div class="logsec">Bereit</div>
      <div class="logitem info"><b>${state.players.length} Anmeldungen</b> · ${main} Haupt-Slots · ${res} Reserve-Slots.<br>
      <span class="mut">Auf „Build the Group" klicken – verteilt nach Wunsch und gespielter Historie.</span></div>
      <div class="logsec">Regeln</div>
      <div class="logitem">1. Wunsch schlägt Historie.</div>
      <div class="logitem">2. Bei Überschneidung entscheidet, wer die Rolle häufiger gespielt hat.</div>
      <div class="logitem">3. Gleiche Rollenfamilie zählt als Teiltreffer.</div>
      <div class="logitem">4. Doppel-Slots (Longbow / Demonfang) nehmen beide Waffen – der Wunsch entscheidet.</div>
      <div class="logitem">5. Reserve-Slots sind 25 % abgewertet; niemand wird dorthin gezogen.</div>
      <div class="logitem">6. Tentative rutscht nach hinten, kein passender Slot → Bank.</div>`;
    return;
  }
  const L = state.log;
  let html = `<div class="logsec">Ergebnis</div>
    <div class="logitem ok"><b>${L.filledMain}/${L.totalMain} Haupt-Slots</b> · ${L.filledRes}/${L.totalRes} Reserve · ${L.bench.length} Bank · ${L.open.length} offen</div>`;

  if(L.conflicts.length){
    html += `<div class="logsec">Überschneidungen (${L.conflicts.length})</div>`;
    html += L.conflicts.map(c=>`<div class="logitem warn">${c}</div>`).join('');
  } else {
    html += `<div class="logsec">Überschneidungen</div><div class="empty-note">Keine – jeder bekam seine höchste passende Rolle.</div>`;
  }

  if(L.bench.length){
    html += `<div class="logsec">Bank (${L.bench.length})</div>`;
    html += L.bench.map(b=>`<div class="logitem">${b}</div>`).join('');
  }
  if(L.open.length){
    html += `<div class="logsec">Offene Slots (${L.open.length})</div>`;
    const shown = L.open.slice(0, 10);
    html += shown.map(o=>`<div class="logitem bad">${o}</div>`).join('');
    if(L.open.length > shown.length) html += `<div class="empty-note">… und ${L.open.length - shown.length} weitere</div>`;
  }
  html += `<div class="logsec">Hinweise</div>`;
  html += (L.notes.length ? L.notes.map(n=>`<div class="logitem info">${n}</div>`).join('') : '<div class="empty-note">Keine.</div>');
  el.innerHTML = html;
}

/* =====================================================================
   AKTIONEN
   ===================================================================== */
function findSlotInfo(name){
  for(let pi=0;pi<state.parties.length;pi++){
    const sl = state.parties[pi].slots.find(x=>x.player===name);
    if(sl) return {slot:sl, pi};
  }
  return null;
}
function pickFor(name, slot, pi){
  const p = state.players.find(x=>x.name===name);
  if(!p) return slot.weapons[0] || null;
  const tier = pi!=null && state.parties[pi] ? state.parties[pi].tier : 'main';
  return bestPick(p, {weapons:slot.weapons, caller:slot.caller, tier}).pick;
}
function place(pi, si, name){
  const target = state.parties[pi].slots[si];
  if(!target.weapons.length || target.player === name) return;
  const from = findSlotInfo(name);
  const prevName = target.player;

  if(from){ from.slot.player = prevName || null; from.slot.pick = null; }
  target.player = name;
  target.pick = pickFor(name, target, pi);
  if(from && prevName) from.slot.pick = pickFor(prevName, from.slot, from.pi);

  save();
}

function clearSeats(){
  state.parties.forEach(pt=>pt.slots.forEach(s=>{ s.player=null; s.pick=null; }));
  state.log = null; state.builtAt = null;
  save(); toast('Sitze geleert');
}

function resetAll(){
  if(!confirm('Auf den Ausgangsstand zurücksetzen?')) return;
  state = state.kind === 'test' ? stateFromTest() : freshState('comp40');
  lastBuilt = null;
  save(); toast('Zurückgesetzt');
}

function buildGroup(){
  const players = state.players.slice();
  const all = flatSlots();
  const active = all.filter(s=>s.weapons.length);
  const res = solveAssignment(players, active.map(s=>({weapons:s.weapons, caller:s.caller, tier:s.tier})));

  state.parties.forEach(pt=>pt.slots.forEach(s=>{ s.player=null; s.pick=null; }));
  res.forEach((r,i)=>{ if(r){ active[i].ref.player = r.player.name; active[i].ref.pick = r.pick; } });

  lastBuilt = {at:Date.now()};
  const assigned = {};
  res.forEach((r,i)=>{ if(r) assigned[r.player.name] = {slot:active[i], score:r.score, pick:r.pick}; });

  const bench = players.filter(p=>!assigned[p.name]);
  const open = active.filter((s,i)=>!res[i]);

  const conflicts = [];
  players.forEach(p=>{
    const a = assigned[p.name];
    if(!a) return;
    if(p.caller) return;   // Caller ist gesetzt, kein Konflikt
    let best = {score:a.score, slot:a.slot, pick:a.pick};
    active.forEach(s=>{
      const bp = bestPick(p, {weapons:s.weapons, caller:s.caller, tier:s.tier});
      if(bp.score > best.score + 0.01) best = {score:bp.score, slot:s, pick:bp.pick};
    });
    if(best.slot !== a.slot){
      // Reserve schlaegt nie einen Haupt-Slot: das ist die Zweistufen-Regel, kein Konflikt.
      const tierRank = t => (t === 'reserve' ? 1 : 0);
      if(tierRank(best.slot.tier) > tierRank(a.slot.tier)) return;
      const occ = best.slot.ref.player;
      const occP = state.players.find(x=>x.name===occ);
      conflicts.push(`${esc(p.name)}: ${esc(slotLabel(best.slot))} (${(p.hist||{})[canon(best.pick)]||0}×) war stärker, ging an <b>${esc(occ||'–')}</b> (${(occP&&(occP.hist||{})[canon(best.pick)])||0}×) → ${esc(slotLabel(a.slot))}`);
    }
  });

  const byWeapon = {};
  players.forEach(p=>{
    const first = (p.prefs||[])[0];
    if(first) (byWeapon[canon(first)] = byWeapon[canon(first)] || []).push(p);
  });
  Object.entries(byWeapon).forEach(([w,list])=>{
    if(list.length > 1){
      const winner = list.find(p=>assigned[p.name] && canon(assigned[p.name].pick) === w);
      if(winner){
        const losers = list
          .filter(p=>p!==winner)
          .filter(p=>!(assigned[p.name] && canon(assigned[p.name].pick) === w))
          .map(p=>`${esc(p.name)} (${(p.hist||{})[w]||0}×)`);
        if(!losers.length) return;
        const msg = `<b>${esc(w)}</b>: ${esc(winner.name)} (${(winner.hist||{})[w]||0}×) gesetzt, ${losers.join(', ')} ausgewichen.`;
        if(!conflicts.some(c=>c.includes(esc(w)))) conflicts.push(msg);
      }
    }
  });

  const benchText = bench.map(p=>{
    const cands = active.map(s=>({s, bp:bestPick(p,{weapons:s.weapons, caller:s.caller, tier:s.tier})}))
      .sort((a,b)=>b.bp.score-a.bp.score).slice(0,2).filter(x=>x.bp.score>0);
    const hint = cands.length
      ? ` · möglich: ${cands.map(c=>esc(slotLabel(c.s))).join(', ')} (${Math.round(cands[0].bp.score)} Pkt)`
      : ' · keine passende Rolle';
    return `<b>${esc(p.name)}</b>${p.tentative?' (tentative)':''}${hint}`;
  });

  const notes = [];
  state.parties.filter(pt=>pt.tier==='main').forEach(pt=>{
    const h = pt.slots.filter(s=>s.player && roleOf(s.pick||s.weapons[0])==='Healer').length;
    if(h < 2) notes.push(`${esc(pt.name)} hat ${h} Heiler – die aktuelle Comp sieht 4–5 vor.`);
  });
  const neu = players.filter(p=>sumHist(p)===0 && assigned[p.name]);
  if(players.length && neu.length === players.length) notes.push('Historie noch leer – die Zuweisung stützt sich nur auf die Wünsche.');
  else if(neu.length) notes.push(`Ohne Historie gesetzt: ${neu.map(p=>esc(p.name)).join(', ')} – nach Wunsch, nicht nach Erfahrung.`);
  const callerSlot = active.find(s=>s.caller);
  const callerPlayer = callerSlot && callerSlot.ref.player ? state.players.find(p=>p.name===callerSlot.ref.player) : null;
  if(callerSlot && callerSlot.ref.player && !(callerPlayer||{}).caller){
    notes.push(`Caller-Slot mit <b>${esc(callerSlot.ref.player)}</b> besetzt – in den Signups ist niemand als Caller markiert.`);
  }
  const tent = players.filter(p=>p.tentative && assigned[p.name]);
  if(tent.length) notes.push(`Tentative eingeplant: ${tent.map(p=>esc(p.name)).join(', ')}.`);
  const inReserve = players.filter(p=>assigned[p.name] && assigned[p.name].slot.tier==='reserve');
  if(inReserve.length) notes.push(`Auf Reserve-Slots: ${inReserve.map(p=>esc(p.name)).join(', ')}.`);
  const familyOnly = players.filter(p=>{
    const a = assigned[p.name];
    if(!a || a.slot.tier === 'reserve') return false;
    return !(p.prefs||[]).map(canon).includes(canon(a.pick));
  });
  if(familyOnly.length) notes.push(`Ohne exakten Wunsch auf Haupt-Slots: ${familyOnly.map(p=>`${esc(p.name)} (${esc(assigned[p.name].pick)})`).join(', ')} – nur über die Rollenfamilie.`);

  const main = active.filter(s=>s.tier==='main');
  const reserve = active.filter(s=>s.tier==='reserve');
  state.log = {
    filledMain: main.filter(s=>s.ref.player).length,
    totalMain: main.length,
    filledRes: reserve.filter(s=>s.ref.player).length,
    totalRes: reserve.length,
    bench: benchText,
    open: open.map(s=>`<b>${esc(slotLabel(s))}</b> (${esc(state.parties[s.pi].name)}) – niemand mit passendem Wunsch`),
    conflicts,
    notes
  };
  state.builtAt = Date.now();
  save();
  toast('Gruppe gebaut');
}

/* ---------- Picker ---------- */
function openPicker(pi, si){
  const slot = state.parties[pi].slots[si];
  const cands = state.players
    .filter(p=>!findSlot(p.name))
    .map(p=>({p, bp:bestPick(p, {weapons:slot.weapons, caller:slot.caller, tier:state.parties[pi].tier})}))
    .filter(c=>c.bp.score > NO_MATCH + 1)
    .sort((a,b)=>b.bp.score-a.bp.score);
  const rows = cands.map(c=>{
    const r = reasonFor(c.p, slot, c.bp.pick);
    return `<div class="pick" data-name="${esc(c.p.name)}">
      <span class="dot" style="background:${ROLE_COLOR[slotRole(slot)]||'#888'}"></span>
      <span><b>${esc(c.p.name)}</b>${c.bp.pick && slot.weapons.length>1?` <span class="mut" style="font-size:.75rem">→ ${esc(c.bp.pick)}</span>`:''}
      <br><span class="mut" style="font-size:.75rem">${esc(r.text)}</span></span>
      <span class="sc">${Math.round(c.bp.score)} Pkt</span>
    </div>`;
  }).join('');
  $('#modal').innerHTML = `<h3>${esc(slotLabel(slot))} besetzen</h3>
    <p class="mut" style="font-size:.85rem;margin:0 0 8px">${esc(state.parties[pi].name)} · ${cands.length} freie Spieler, sortiert nach Passung.</p>
    <div class="picker">${rows || '<p class="empty-note">Keine freien Spieler.</p>'}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="b" onclick="closeModal()">Abbrechen</button></div>`;
  $('#modal').querySelectorAll('.pick').forEach(el=>{
    el.addEventListener('click', ()=>{ place(pi, si, el.dataset.name); closeModal(); });
  });
  $('#overlay').classList.add('open');
}
function closeModal(){ $('#overlay').classList.remove('open'); }

/* ---------- Import ---------- */
function openImport(){
  $('#modal').innerHTML = `<h3>Signups einfügen</h3>
    <p class="mut" style="font-size:.85rem;margin:0 0 8px">Eine Zeile pro Spieler:
      <code>Name | Waffe1, Waffe2 | Waffe=Anzahl, Waffe=Anzahl</code>.
      Historie ist optional, <code>?</code> am Ende markiert tentative.
      Kurzformen (<code>Spiked</code>, <code>Perma</code>, <code>Locus Defensive</code>) werden erkannt.</p>
    <textarea id="imp" rows="12" placeholder="Relgok | 1H Mace, 1H Hammer (Setup) | 1H Mace=18, 1H Hammer (Setup)=4
Sentus | Spiked Gauntlets, Longbow | Spiked Gauntlets=22, Longbow=6
Silas | Longbow, Demonfang | Longbow=7 ?"></textarea>
    <div class="row" style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="b primary" onclick="doImport(false)">Anhängen</button>
      <button class="b" onclick="doImport(true)">Ersetzen</button>
      <button class="b ghost" onclick="closeModal()">Abbrechen</button>
    </div>`;
  $('#overlay').classList.add('open');
  setTimeout(()=>$('#imp')&&$('#imp').focus(), 50);
}
function parseSignups(text){
  const out = [];
  text.split(/\r?\n/).forEach(line=>{
    let raw = line.trim();
    if(!raw || raw.startsWith('#')) return;
    let tentative = false;
    if(/\?\s*$/.test(raw)){ tentative = true; raw = raw.replace(/\?\s*$/,'').trim(); }
    const parts = raw.split('|').map(x=>x.trim());
    const name = parts[0];
    if(!name) return;
    const prefs = (parts[1]||'').split(',').map(x=>x.trim()).filter(Boolean).map(canon);
    const hist = {};
    (parts[2]||'').split(',').forEach(pair=>{
      const m = pair.match(/^(.+?)\s*=\s*(\d+)$/);
      if(m) hist[canon(m[1])] = +m[2];
    });
    out.push({name, prefs, hist, tentative});
  });
  return out;
}
function doImport(replace){
  const parsed = parseSignups($('#imp').value);
  if(!parsed.length){ toast('Keine gültigen Zeilen erkannt'); return; }
  if(replace){
    state.players = parsed;
    state.parties.forEach(pt=>pt.slots.forEach(s=>{ s.player=null; s.pick=null; }));
  } else {
    parsed.forEach(p=>{
      const ex = state.players.find(x=>x.name.toLowerCase()===p.name.toLowerCase());
      if(ex) Object.assign(ex, p); else state.players.push(p);
    });
  }
  state.log = null; state.builtAt = null;
  save(); closeModal();
  toast(parsed.length + (replace?' Spieler übernommen':' Zeilen verarbeitet'));
}

/* ---------- Demo / Realtime ---------- */
function simulateSignup(){
  const free = SIGNUP_POOL.filter(p=>!state.players.some(x=>x.name===p.name));
  if(!free.length){ toast('Alle Demo-Signups sind schon drin'); return; }
  const p = free[Math.floor(Math.random()*free.length)];
  state.players.push(JSON.parse(JSON.stringify(p)));
  state.log = null;
  save();
  toast('Neue Anmeldung: ' + p.name);
}
function openSecondTab(){
  const w = window.open(location.href, '_blank');
  if(!w) toast('Popup blockiert');
  else setTimeout(()=>toast('Zweiter Tab: Änderungen erscheinen dort live'), 400);
}

/* ---------- Copy ---------- */
function copyRoster(){
  const txt = state.parties.map(pt=>{
    const rows = pt.slots.filter(s=>s.weapons.length).map(s=>
      `  ${(s.player||'—').padEnd(14)} ${slotLabel(s)}${s.player&&s.pick&&s.weapons.length>1?' ('+s.pick+')':''}`
    ).join('\n');
    return `${pt.name}\n${rows}`;
  }).join('\n\n');
  navigator.clipboard.writeText(txt).then(()=>toast('Roster kopiert')).catch(()=>toast('Kopieren nicht möglich'));
}

/* ---------- Historie ---------- */
function applyHistory(){
  const seated = state.parties.flatMap(p=>p.slots).filter(s=>s.player && s.pick);
  if(!seated.length){ toast('Niemand gesetzt – erst bauen'); return; }
  if(!confirm(seated.length + ' Einsätze als gespielt zählen?')) return;
  seated.forEach(s=>{
    const p = state.players.find(x=>x.name === s.player);
    if(!p) return;
    p.hist = p.hist || {};
    const k = canon(s.pick);
    p.hist[k] = (p.hist[k] || 0) + 1;
  });
  save();
  toast('Historie um 1 erhöht');
}

/* ---------- Live (Worker-Proxy) ---------- */
const LIVE_ENDPOINT = '';   // z.B. https://…workers.dev/roster/live
let liveTimer = null, liveSeq = 0;

function setLiveBtn(on){
  const b = $('#live-btn');
  if(!b) return;
  b.textContent = on ? 'Live: an' : 'Live: aus';
  b.classList.toggle('on', on);
}
function toggleLive(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer = null; setLiveBtn(false); toast('Live gestoppt'); return; }
  if(!LIVE_ENDPOINT){ toast('Kein Live-Endpunkt: Worker-Route /roster/live fehlt noch'); return; }
  liveSeq = 0;
  setLiveBtn(true);
  pollLive();
  liveTimer = setInterval(pollLive, 5000);
  toast('Live verbunden – Abfrage alle 5 s');
}
async function pollLive(){
  try{
    const res = await fetch(LIVE_ENDPOINT + (LIVE_ENDPOINT.includes('?') ? '&' : '?') + 'sinceSeq=' + liveSeq, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(typeof data.assignmentsSeq === 'number') liveSeq = data.assignmentsSeq;

    let added = 0;
    (data.players || []).forEach(p=>{
      if(!p || !p.displayName) return;
      if(state.players.some(x=>x.name.toLowerCase() === p.displayName.toLowerCase())) return;
      state.players.push({
        name: p.displayName,
        prefs: (p.preferenceRoleIds || p.prefs || []).map(canon).filter(Boolean),
        hist: {}, tentative: !!p.isTentative
      });
      added++;
    });
    if(added){
      state.log = null;
      save();
      toast(added === 1 ? 'Neue Anmeldung eingetroffen' : added + ' neue Anmeldungen');
    }
  }catch(e){
    clearInterval(liveTimer); liveTimer = null; setLiveBtn(false);
    toast('Live-Fehler: ' + e.message);
  }
}

/* ---------- Init ---------- */
state = load() || stateFromTest();
render();
</script>
